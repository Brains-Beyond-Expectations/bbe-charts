name: Preview

# Publishes the charts a pull request changes as a pre-release, with a library listing them, so the changes can be
# installed with `bbe install --library <url>` before they're merged. The pre-release is removed when the pull
# request closes.
#
# Charts are compared with the default branch, so a pull request stacked on another one includes that one's charts
# too. A chart depending on another changed chart gets that chart's preview, so both can be tested together before
# either is released.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}
  TAG: preview-pr-${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_REF: ${{ github.event.pull_request.base.ref }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  BBE_REPOSITORY: https://brains-beyond-expectations.github.io/bbe-charts
  REPOSITORY: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  COMMENT_MARKER: "<!-- bbe-preview -->"

jobs:
  publish:
    name: Publish preview
    # Pull requests from forks can't publish releases here
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find changed charts
        id: changed
        run: |
          charts=""
          for chart in $(git diff --name-only "origin/${DEFAULT_BRANCH}...HEAD" -- charts/ | cut -d/ -f2 | sort -u); do
            if [ -f "charts/${chart}/Chart.yaml" ]; then
              charts="${charts} ${chart}"
            fi
          done
          echo "charts=${charts}" >> "$GITHUB_OUTPUT"
          echo "Changed charts:${charts:- none}"
      - name: Remove the preview of a pull request that no longer changes charts
        if: steps.changed.outputs.charts == ''
        run: gh release delete "$TAG" --cleanup-tag --yes --repo "$REPOSITORY" || true
      - name: Set up Helm
        if: steps.changed.outputs.charts != ''
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Set up Go
        if: steps.changed.outputs.charts != ''
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: |
            lib-gen/go.sum
      - name: Package charts
        if: steps.changed.outputs.charts != ''
        env:
          CHARTS: ${{ steps.changed.outputs.charts }}
          RUN: ${{ github.run_number }}
        run: |
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

          # The released version is only set when the pull request merges, so the preview builds on the current one
          declare -A versions
          for chart in $CHARTS; do
            versions[$chart]="$(yq '.version' "charts/${chart}/Chart.yaml")-pr${PR}.${RUN}"
            VERSION="${versions[$chart]}" yq -i '.version = env(VERSION)' "charts/${chart}/Chart.yaml"
          done

          # A chart depending on another changed chart gets that chart's preview, as the version it depends on is
          # only published once the pull request merges
          linked=""
          for chart in $CHARTS; do
            for dependency in $(yq '(.dependencies // [])[] | select(.repository == env(BBE_REPOSITORY)) | .name' "charts/${chart}/Chart.yaml"); do
              if [ -n "${versions[$dependency]:-}" ]; then
                DEPENDENCY="$dependency" VERSION="${versions[$dependency]}" yq -i \
                  '(.dependencies[] | select(.name == env(DEPENDENCY) and .repository == env(BBE_REPOSITORY))) |= (.repository = "file://../" + env(DEPENDENCY) | .version = env(VERSION))' \
                  "charts/${chart}/Chart.yaml"
                echo "${chart} uses the preview of ${dependency}"
                linked="${linked} ${chart}"
              fi
            done
          done

          # Charts using other previews go last, so those are complete when they're copied in
          mkdir dist
          for chart in $(for c in $CHARTS; do case " $linked " in *" $c "*) ;; *) echo "$c" ;; esac; done) $(echo "$linked" | tr ' ' '\n' | sort -u); do
            helm dependency update "charts/${chart}"
            helm package "charts/${chart}" --destination dist
          done

          entries=()
          for chart in $CHARTS; do
            entries+=("${chart}=${versions[$chart]}")
          done
          echo "VERSIONS=${entries[*]}" >> "$GITHUB_ENV"

          repository_url="https://github.com/${REPOSITORY}/releases/download/${TAG}"
          helm repo index dist --url "$repository_url"
          (cd lib-gen && go run . preview -repository-url "$repository_url" -repository-name "bbe-pr-${PR}" -output ../dist/library.yaml "${entries[@]}")
          cat dist/library.yaml
      - name: Publish pre-release
        if: steps.changed.outputs.charts != ''
        run: |
          # The release and its tag stay for the life of the pull request, with only their files replaced, as moving
          # a tag makes `git fetch` fail for everyone who fetched it before
          if gh release view "$TAG" --repo "$REPOSITORY" > /dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" --yes --repo "$REPOSITORY"
            done
            gh release upload "$TAG" dist/* --repo "$REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$REPOSITORY" --prerelease --target "$HEAD_SHA" \
              --title "Preview of #${PR}" \
              --notes "Charts from #${PR} for testing before it's merged. Removed when the pull request closes."
          fi
      - name: Comment on the pull request
        if: steps.changed.outputs.charts != ''
        run: |
          library_url="https://github.com/${REPOSITORY}/releases/download/${TAG}/library.yaml"
          {
            echo "$COMMENT_MARKER"
            echo "### Preview"
            echo
            echo "The charts this pull request changes are published for testing, as of ${HEAD_SHA}:"
            if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
              echo
              echo "This pull request is stacked on \`${BASE_REF}\`, so its charts are included too."
            fi
            echo
            echo "| Chart | Version |"
            echo "|---|---|"
            for entry in $VERSIONS; do
              echo "| \`${entry%%=*}\` | \`${entry#*=}\` |"
            done
            echo
            echo "Charts that are bbe packages are in the library, and the rest are only bundled into them. Install them with bbe:"
            echo
            echo '```'
            echo "bbe install --library ${library_url}"
            echo '```'
            echo
            echo "To test them with a bbe-quest branch, run \`go run . install --library ${library_url}\` in its \`cli\` folder."
            echo "The preview is removed when this pull request closes."
          } > comment.md

          comment_id=$(gh api "repos/${REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${COMMENT_MARKER}\")) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPOSITORY" --body-file comment.md
          fi

  cleanup:
    name: Remove preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete pre-release
        run: gh release delete "$TAG" --cleanup-tag --yes --repo "$REPOSITORY" || true
      - name: Update the comment
        run: |
          comment_id=$(gh api "repos/${REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${COMMENT_MARKER}\")) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            printf '%s\n### Preview\n\nThe preview was removed when this pull request closed.\n' "$COMMENT_MARKER" > comment.md
            gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" -F body=@comment.md > /dev/null
          fi
