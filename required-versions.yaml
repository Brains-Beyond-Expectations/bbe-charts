charts:
  - name: bbe-auth
    # Reads the users setting, which lists fields instead of a catalog, and the prerequisite naming only a package
    min-bbe-cli: 1.7.0
  - name: bbe-media
    # Reads the prerequisites naming only a package, bbe-networking and bbe-auth
    min-bbe-cli: 1.7.0
  - name: bbe-networking
    # Applies the CRDs of Traefik, which helm only installs on a first install
    min-bbe-cli: 1.7.0
