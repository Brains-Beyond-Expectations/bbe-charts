bbe:
  metallb:
    blocky:
      ipAddressPool:

metallb:
  crds:
    # Helm creates the address pools as soon as MetalLB is installed, before its webhook is serving.
    # The webhook still checks pools once it's up
    validationFailurePolicy: Ignore
  speaker:
    ignoreExcludeLB: true

ingress-nginx:
  controller:
    service:
      enabled: true
      type: LoadBalancer
      loadBalancerIP:
    allowSnippetAnnotations: true
    config:
      annotations-risk-level: Critical
      strict-validate-path-type: false
    ingressClassResource:
      name: nginx
      enabled: true
      default: true
      controllerValue: "k8s.io/ingress-nginx"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
