global:
  bbe:
    # -- The domain the cluster's apps are named under, such as jellyfin.bbe.home.arpa. Blocky answers for it and
    # everything under it with the ingress's IP, and bbe's own certificate authority signs a certificate for it.
    # home.arpa itself can't be used: browsers treat it as a public suffix like .com, so a certificate for
    # *.home.arpa is refused and a login can't be shared between apps under it
    domain: bbe.home.arpa
    ingress:
      # -- The IP address for the ingress, on the same network as your nodes
      loadBalancerIP:
    # The house's DNS, Blocky. bbe writes these into bbe.yaml with their defaults, so they're there to change
    dns:
      # -- Where Blocky asks for the names it doesn't block or know, encrypted with DNS-over-HTTPS. It asks the two
      # fastest. Quad9 also refuses names it knows to be malicious
      upstreams:
        - https://dns.quad9.net/dns-query
        - https://cloudflare-dns.com/dns-query
      # -- How Blocky finds the upstreams' and the blocklists' own addresses, encrypted too. Each upstream is listed
      # with its addresses, so nothing is asked in plain text
      bootstrap:
        - upstream: https://dns.quad9.net/dns-query
          ips:
            - 9.9.9.9
            - 149.112.112.112
        - upstream: https://cloudflare-dns.com/dns-query
          ips:
            - 1.1.1.1
            - 1.0.0.1
      blocking:
        # -- The blocklists, by group, in a format Blocky reads: hosts files, or a domain, `*.domain` with
        # everything under it, or `/regex/` per line. HaGeZi's lists are kept up to date, rarely block what they
        # shouldn't, and are in the `*.domain` format. Only the groups some device gets are downloaded, so `adult` is
        # there to turn on. Every list is held in memory: more than the defaults may need more for Blocky
        # @default -- ads: HaGeZi's Multi Normal; security: HaGeZi's Threat Intelligence Feeds mini; adult: HaGeZi's NSFW
        lists:
          # Ads, tracking, telemetry and the worst of malware, with very few sites broken
          ads:
            - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/multi.txt
          # Malware, phishing, scams and cryptojacking, from threat intelligence feeds
          security:
            - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.mini.txt
          # Adult sites, for the devices given this group, such as children's
          adult:
            - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/nsfw.txt
        # -- The groups every device gets, unless `clients` names it
        groups:
          - ads
          - security
        # -- Groups for some devices instead, by IP address, subnet (CIDR) or name, such as
        # `192.168.1.50: [ads, security, adult]`. A device given no groups (`[]`) isn't blocked at all
        clients: {}
        # -- Domains never blocked, by any group, such as `example.com`, with everything under them
        allowed: []
        # -- How often the lists are downloaded again
        refreshPeriod: 6h
        # -- How long devices remember that a name is blocked, so unblocking one works within this time
        blockTTL: 1m
      # -- More names Blocky answers itself, with an address each, such as `nas.home.arpa: 192.168.1.10`. The domain
      # is already answered with the ingress's IP
      records: {}
      # -- Domains asked of another DNS server, such as the router's own, like `fritz.box: 192.168.1.1`
      forward: {}
      # Refusing upstream answers pointing at private addresses, which a website could use to reach the house's
      # network through a browser
      rebindingProtection:
        # -- Whether to refuse them
        enabled: true
        # -- Domains whose public DNS points at private addresses on purpose, which are let through
        allowedDomains: []
      # -- Where Blocky logs every query: `none`, or `console` for its output, which bbe-observability keeps in Loki.
      # None by default, as it's who looked up what
      queryLog: none

bbe:
  metallb:
    blocky:
      # -- The IP address for the Blocky DNS service, or a range such as 192.168.1.240-192.168.1.245
      ipAddressPool:
  dashboard:
    # -- Whether to serve the cluster's landing page at https://<domain>, with Homepage. It lists every app whose
    # Ingress has `gethomepage.dev/enabled: "true"`, with whether its pods run
    enabled: true
    image:
      # -- The Homepage image
      repository: ghcr.io/gethomepage/homepage
      # -- The Homepage version
      tag: v2.5.0
    # -- Homepage's settings.yaml, see https://gethomepage.dev/configs/settings. Its layout orders the groups the apps'
    # annotations put them in, so it's kept as text, as Helm would sort the groups by name
    settings: |
      title: bbe
      headerStyle: clean
      layout:
        Watch:
          style: row
          columns: 4
        Read:
          style: row
          columns: 4
        Listen:
          style: row
          columns: 4
        Keep:
          style: row
          columns: 4
        Manage:
          style: row
          columns: 4
        Cluster:
          style: row
          columns: 4
    # -- Links to list besides the apps found in the cluster, as Homepage's services.yaml
    services: []
    # -- Homepage's bookmarks.yaml
    bookmarks: []
    # -- Homepage's widgets.yaml. Its Kubernetes widgets need metrics-server, which Talos doesn't run by default
    widgets: []
    resources:
      requests:
        # -- The memory to request for the dashboard
        memory: 96Mi
        # -- The CPU to request for the dashboard
        cpu: 10m
      limits:
        # -- The memory to limit the dashboard to
        memory: 256Mi
  certificates:
    # -- How long bbe's certificate authority is valid. Devices that trust it need its new certificate once it's
    # renewed
    caDuration: 87600h
    # -- How long the certificate for the domain is valid. cert-manager renews it a third of the way before it expires
    duration: 2160h

metallb:
  crds:
    # MetalLB's CRDs are in this chart's crds/ folder, written by update-crds.sh, so Helm knows them before the hooks
    # creating the address pools run
    enabled: false
    # Helm creates the address pools as soon as MetalLB is installed, before its webhook is serving.
    # The webhook still checks pools once it's up
    validationFailurePolicy: Ignore
  speaker:
    ignoreExcludeLB: true

traefik:
  service:
    type: LoadBalancer
    annotations:
      metallb.io/address-pool: default
  ingressClass:
    enabled: true
    isDefaultClass: true
    name: traefik
  providers:
    kubernetesIngress:
      publishedService:
        enabled: true
  ports:
    web:
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
  # Every app under the domain is served with its certificate, so an ingress only lists its host under `tls`
  tlsStore:
    default:
      defaultCertificate:
        secretName: bbe-domain-tls

cert-manager:
  crds:
    # cert-manager's CRDs are in this chart's crds/ folder, written by update-crds.sh, so Helm knows them before the
    # hooks creating the certificates run
    enabled: false
  # The startup check waits for cert-manager's webhook to answer, which it must before the certificates are created.
  # It runs on upgrades too, so the certificates, which are hooks as well, are only recreated once it's up
  startupapicheck:
    jobAnnotations:
      helm.sh/hook: post-install,post-upgrade
      helm.sh/hook-weight: "1"
      helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    rbac:
      annotations:
        helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-weight: "-5"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    serviceAccount:
      annotations:
        helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-weight: "-5"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

blocky:
  service:
    annotations:
      metallb.io/address-pool: blocky
  blocky:
    # The blocklists are held in memory: with the defaults' 390,000 domains, Blocky 0.35.0 used about 105MB, and 165MB
    # after refreshing them
    resources:
      requests:
        memory: 160Mi
      limits:
        memory: 384Mi
  config:
    # Blocky's configuration, written from global.bbe.dns by bbe-networking's templates/_blocky.tpl
    yaml: |
      {{- include "bbe-networking.blockyConfig" . }}
