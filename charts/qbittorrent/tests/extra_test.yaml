suite: test extra containers and ports
values:
  - ./values/required-values.yaml
release:
  name: test
  namespace: test
tests:
  - it: should add the extra containers, rendered as a template
    template: deployment.yaml
    set:
      global.port: 4180
      extraContainers: |
        - name: proxy
          image: proxy:1
          ports:
            - containerPort: {{ .Values.global.port }}
    asserts:
      - equal:
          path: spec.template.spec.containers[1]
          value:
            name: proxy
            image: proxy:1
            ports:
              - containerPort: 4180

  - it: should add the extra service ports, rendered as a template
    template: service.yaml
    set:
      global.port: 4180
      service.extraPorts: |
        - name: proxy
          port: {{ .Values.global.port }}
          protocol: TCP
    asserts:
      - contains:
          path: spec.ports
          content:
            name: proxy
            port: 4180
            protocol: TCP
      - contains:
          path: spec.ports
          content:
            name: http
            port: 8080
            protocol: TCP

  - it: should have no extra containers by default
    template: deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1

  - it: should add the extra volumes, rendered as a template
    template: deployment.yaml
    set:
      global.name: proxy-config
      extraVolumes: |
        - name: proxy
          configMap:
            name: {{ .Values.global.name }}
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: proxy
            configMap:
              name: proxy-config
