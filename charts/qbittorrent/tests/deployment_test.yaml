suite: test deployment
values:
  - ./values/required-values.yaml
templates:
  - deployment.yaml
release:
  name: test
  namespace: test
tests:
  - it: should create a Deployment
    asserts:
      - hasDocuments:
          count: 1

  - it: should create a deployment with correct specifications
    asserts:
      - equal:
          path: metadata.name
          value: test-qbittorrent
      - equal:
          path: metadata.namespace
          value: test
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: qbittorrent
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: qbittorrent
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: test
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: test
      - notExists:
          path: spec.template.metadata.annotations
      - equal:
          path: spec.template.spec.containers[0].name
          value: qbittorrent
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ghcr\.io\/linuxserver\/qbittorrent:[^".]+
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TZ
            value: UTC
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGID
            value: "0"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUID
            value: "0"
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: media
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /media

  - it: can add annotations
    set:
      qbittorrent.annotations: {"test": "true"}
    asserts:
      - equal:
          path: spec.template.metadata.annotations["test"]
          value: "true"

  - it: adds WireGuard networking when enabled
    set:
      wireguard.enabled: true
      wireguard.secret.name: wireguard-config
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wireguard-network-init
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.privileged
          value: true
      - equal:
          path: spec.template.spec.containers[1].name
          value: wireguard
      - contains:
          path: spec.template.spec.containers[1].securityContext.capabilities.add
          content: SYS_MODULE
      - equal:
          path: spec.template.spec.volumes[2].secret.secretName
          value: wireguard-config
      - equal:
          path: spec.template.spec.volumes[2].secret.items[0]
          value: {key: wireguard-config, path: wg0.conf}

  - it: comes with probes configured
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket
          value: {port: 8080}
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket
          value: {port: 8080}
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket
          value: {port: 8080}

  - it: should use only chart name if release name contains chart name
    release:
      name: qbittorrent
    asserts:
      - equal:
          path: metadata.name
          value: qbittorrent
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: qbittorrent-config
      - equal:
          path: spec.template.spec.volumes[1].persistentVolumeClaim.claimName
          value: qbittorrent-media

  - it: respects existingClaim for config and media
    release:
      name: qbittorrent
    set:
      config.existingClaim: "test-config"
      media.existingClaim: "test-media"
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: test-config
      - equal:
          path: spec.template.spec.volumes[1].persistentVolumeClaim.claimName
          value: test-media

  - it: respects fullnameOverride
    set:
      fullnameOverride: "test-fullname"
    asserts:
      - equal:
          path: metadata.name
          value: test-fullname

  - it: respects namespaceOverride
    set:
      namespaceOverride: "test-namespace"
    asserts:
      - equal:
          path: metadata.namespace
          value: test-namespace
