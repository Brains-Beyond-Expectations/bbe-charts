suite: test setup
values:
  - ./values/required-values.yaml
templates:
  - setup.yaml
release:
  name: bbe-library
  namespace: bbe-library
  revision: 3
tests:
  - it: should run the setup on Calibre-Web-Automated's Python, with its python-ldap
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: bbe-library-setup-3
      - equal:
          path: spec.template.spec.containers[0].image
          value: crocodilestick/calibre-web-automated:v4.0.8
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /lsiopy/bin/python3
            - /scripts/setup.py

  - it: should reach bbe-auth's LDAP over LDAPS, checking its certificate with bbe's certificate authority, for the
      setup and the people CronJob alike
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LDAP_PORT
            value: "636"
        documentSelector:
          path: kind
          value: Job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LDAP_CA_FILE
            value: /certificates/ca.crt
        documentSelector:
          path: kind
          value: Job
      # Calibre-Web only checks the outpost's certificate when it has one of its own to give, its server's
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CALIBRE_LDAP_CERT_FILE
            value: /certificates/tls.crt
        documentSelector:
          path: kind
          value: Job
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: LDAP_CA_FILE
            value: /certificates/ca.crt
        documentSelector:
          path: kind
          value: CronJob

  - it: should bind to bbe-auth's LDAP with the library's own account
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LDAP_BIND_DN
            value: cn=books-ldap,ou=users,dc=ldap,dc=goauthentik,dc=io
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LDAP_SERVER
            value: bbe-auth-ldap.bbe-auth.svc.cluster.local
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CALIBRE_URL
            value: https://bbe-library-calibre:8083

  - it: should check Calibre-Web's certificate with bbe's certificate authority, without its key
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CALIBRE_CA
            value: /certificates/ca.crt
      - contains:
          path: spec.template.spec.volumes
          content:
            name: certificate
            secret:
              secretName: bbe-library-calibre-tls
              items:
                - key: ca.crt
                  path: ca.crt

  - it: should keep people in line every 10 minutes, as Calibre-Web creates them on their first sign-in
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: spec.schedule
          value: "*/10 * * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MODE
            value: people
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: LDAP_BIND_DN
            value: cn=books-ldap,ou=users,dc=ldap,dc=goauthentik,dc=io

  - it: should set the library up from the Job
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MODE
            value: setup

  - it: should ship the setup script
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["setup.py"]
          pattern: def configure_ereader_emails

  - it: should skip the setup when it's off
    set:
      bbe.setup.enabled: false
    asserts:
      - hasDocuments:
          count: 0
