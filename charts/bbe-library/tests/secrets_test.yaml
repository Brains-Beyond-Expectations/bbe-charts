suite: test secrets
values:
  - ./values/required-values.yaml
templates:
  - secrets.yaml
release:
  name: bbe-library
  namespace: bbe-library
tests:
  - it: should generate the library admin's password, as Calibre-Web's policy wants it
    documentSelector:
      path: metadata.name
      value: bbe-library-admin
    asserts:
      - equal:
          path: data.username
          value: library-admin
          decodeBase64: true
      - matchRegex:
          path: data.password
          pattern: ^[A-Za-z0-9]{24}\.Aa1$
          decodeBase64: true

  - it: should only create what it can copy
    asserts:
      - hasDocuments:
          count: 1

  - it: should keep the admin's password, and copy what it signs in to bbe-auth and bbe-media with
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-library-admin
            namespace: bbe-library
          data:
            password: YWRtaW4tcGFzc3dvcmQ=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-authentik
            namespace: bbe-auth
          data:
            BBE_BOOKS_LDAP_PASSWORD: Ym9va3MtcGFzc3dvcmQ=
            BBE_SHELFMARK_CLIENT_SECRET: c2hlbGZtYXJrLXNlY3JldA==
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-media-api-keys
            namespace: bbe-media
          data:
            prowlarr: cHJvd2xhcnIta2V5
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-media-admin
            namespace: bbe-media
          data:
            username: bWVkaWEtYWRtaW4=
            password: bWVkaWEtcGFzc3dvcmQ=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-ca
            namespace: bbe-networking
          data:
            ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCmJiZQotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0tCg==
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: data.password
          value: admin-password
          decodeBase64: true
        documentIndex: 0
      - equal:
          path: data
          value:
            ldap-password: Ym9va3MtcGFzc3dvcmQ=
            shelfmark-client-secret: c2hlbGZtYXJrLXNlY3JldA==
        documentIndex: 1
      - equal:
          path: data
          value:
            prowlarr-api-key: cHJvd2xhcnIta2V5
            qbittorrent-username: bWVkaWEtYWRtaW4=
            qbittorrent-password: bWVkaWEtcGFzc3dvcmQ=
        documentIndex: 2
      - matchRegex:
          path: data["ca.crt"]
          pattern: BEGIN CERTIFICATE
        documentIndex: 3
