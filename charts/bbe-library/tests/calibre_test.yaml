suite: test calibre
values:
  - ./values/required-values.yaml
templates:
  - calibre.yaml
  - folders.yaml
  - user.yaml
release:
  name: bbe-library
  namespace: bbe-library
tests:
  - it: should create the library's folders and an empty library as the NAS user
    template: folders.yaml
    release:
      revision: 2
    asserts:
      - equal:
          path: metadata.name
          value: bbe-library-folders-2
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1031
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 100
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: mkdir -p /share/books /share/books-ingest
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: cp /app/calibre-web-automated/empty_library/metadata.db /share/books/metadata.db
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: bbe-library-share

  - it: should keep the library and ingest folders on the share, and its databases off NFS
    template: calibre.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: share
            mountPath: /share
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: dirs
            mountPath: /app/calibre-web-automated/dirs.json
            subPath: dirs.json
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: share
            persistentVolumeClaim:
              claimName: bbe-library-share
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 100
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            persistentVolumeClaim:
              claimName: bbe-library-calibre-config
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should run for NFS, without looking for a library as root
    template: calibre.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NETWORK_SHARE_MODE
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISABLE_LIBRARY_AUTOMOUNT
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: bbe-library-user

  - it: should serve HTTPS with its own certificate, named in its settings before it starts
    template: calibre.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: https
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "if \\[ ! -f /config/app.db \\]; then\\n  cd /app/calibre-web-automated\\n  /lsiopy/bin/python3 cps.py -d\\n"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "UPDATE settings SET config_certfile = '/certificates/tls.crt', config_keyfile = '/certificates/tls.key'"
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 1031
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: certificate
            mountPath: /certificates
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: certificate
            secret:
              secretName: bbe-library-calibre-tls
              defaultMode: 0440
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.scheme
          value: HTTPS
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.scheme
          value: HTTPS
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
          value: HTTPS

  - it: should get its certificate from bbe's certificate authority, for its Service's names
    template: calibre.yaml
    documentSelector:
      path: kind
      value: Certificate
    asserts:
      - equal:
          path: spec.secretName
          value: bbe-library-calibre-tls
      - equal:
          path: spec.issuerRef
          value:
            kind: ClusterIssuer
            name: bbe-ca
      - equal:
          path: spec.dnsNames
          value:
            - bbe-library-calibre
            - bbe-library-calibre.bbe-library
            - bbe-library-calibre.bbe-library.svc
            - bbe-library-calibre.bbe-library.svc.cluster.local

  - it: should have Traefik connect to it over HTTPS, checking its certificate
    template: calibre.yaml
    asserts:
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/service.serversscheme"]
          value: https
        documentSelector:
          path: kind
          value: Service
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/service.serverstransport"]
          value: bbe-library-bbe-library-calibre@kubernetescrd
        documentSelector:
          path: kind
          value: Service
      - equal:
          path: metadata.name
          value: bbe-library-calibre
        documentSelector:
          path: kind
          value: ServersTransport
      - equal:
          path: spec
          value:
            serverName: bbe-library-calibre.bbe-library.svc
            rootCAs:
              - secret: bbe-library-calibre-tls
        documentSelector:
          path: kind
          value: ServersTransport

  - it: should leave Traefik's settings out when it isn't served through Traefik
    template: calibre.yaml
    set:
      bbe.ingress.enabled: false
    asserts:
      - containsDocument:
          kind: ServersTransport
          apiVersion: traefik.io/v1alpha1
        not: true
      - notExists:
          path: metadata.annotations
        documentSelector:
          path: kind
          value: Service

  - it: should name the library and ingest folders in the share
    template: calibre.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["dirs.json"]
          pattern: '"calibre_library_dir": "/share/books"'
      - matchRegex:
          path: data["dirs.json"]
          pattern: '"ingest_folder": "/share/books-ingest"'

  - it: should run the apps as the NAS user
    template: user.yaml
    asserts:
      - equal:
          path: data
          value:
            PUID: "1031"
            PGID: "100"

  - it: should keep its config on Longhorn
    template: calibre.yaml
    documentSelector:
      path: kind
      value: PersistentVolumeClaim
    asserts:
      - equal:
          path: spec.storageClassName
          value: longhorn

  - it: should require the books' NFS share and NAS user
    set:
      bbe.library.nfs.server: ""
    asserts:
      - failedTemplate: {}
