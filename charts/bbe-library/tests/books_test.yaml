suite: test books
values:
  - ./values/required-values.yaml
templates:
  - books.yaml
release:
  name: bbe-library
  namespace: bbe-library
tests:
  - it: should link the books' share, and mount its folders directly, keeping them when the volumes go
    documentSelector:
      path: kind
      value: PersistentVolume
      matchMany: true
    asserts:
      - equal:
          path: spec.persistentVolumeReclaimPolicy
          value: Retain
      - equal:
          path: spec.mountOptions
          value:
            - nfsvers=4

  - it: should mount the library and ingest folders without going through the share's own folder
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: spec.nfs
          value:
            server: 192.168.1.10
            path: /volume1/media
        documentIndex: 0
      - equal:
          path: spec.nfs
          value:
            server: 192.168.1.10
            path: /volume1/media/books
        documentIndex: 2
      - equal:
          path: spec.claimRef
          value:
            namespace: bbe-library
            name: bbe-library-calibre-books
        documentIndex: 2
      - equal:
          path: spec.nfs
          value:
            server: 192.168.1.10
            path: /volume1/media/books-ingest
        documentIndex: 4
      - equal:
          path: metadata.name
          value: bbe-library-bbe-library-calibre-ingest
        documentIndex: 4

  - it: should take the share's path with a trailing slash
    set:
      bbe.library.nfs.path: /volume1/media/
    asserts:
      - equal:
          path: spec.nfs.path
          value: /volume1/media/books
        documentIndex: 2

  - it: should link bbe-media's share read-only, for qBittorrent's downloads
    kubernetesProvider:
      scheme:
        "v1/PersistentVolume":
          gvr:
            version: "v1"
            resource: "persistentvolumes"
          namespaced: false
      objects:
        - apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: bbe-media-bbe-media-library
          spec:
            capacity:
              storage: 1Ti
            mountOptions:
              - nfsvers=4
            nfs:
              server: 192.168.1.219
              path: /volume1/bbe-media
    asserts:
      - hasDocuments:
          count: 8
      - equal:
          path: spec.nfs
          value:
            server: 192.168.1.219
            path: /volume1/bbe-media
            readOnly: true
        documentIndex: 6
      - equal:
          path: spec.accessModes
          value:
            - ReadOnlyMany
        documentIndex: 6
      - equal:
          path: spec.volumeName
          value: bbe-library-bbe-library-downloads
        documentIndex: 7
