suite: test sso
values:
  - ./values/required-values.yaml
templates:
  - sso.yaml
release:
  name: bbe-library
  namespace: bbe-library
tests:
  - it: should remove authentik's headers from what anyone sends
    documentSelector:
      path: metadata.name
      value: strip-sso-headers
    asserts:
      - equal:
          path: spec.headers.customRequestHeaders
          value:
            X-authentik-username: ""
            X-authentik-groups: ""
            X-authentik-email: ""
            X-authentik-name: ""
            X-authentik-uid: ""

  - it: should ask bbe-auth's authentik over HTTPS, passing on who it let in
    documentSelector:
      path: metadata.name
      value: sso
    asserts:
      - equal:
          path: spec.forwardAuth.address
          value: https://bbe-auth-server.bbe-auth.svc.cluster.local/outpost.goauthentik.io/auth/traefik
      # Checking authentik's certificate with bbe's certificate authority
      - equal:
          path: spec.forwardAuth.tls
          value:
            caSecret: bbe-ca-cert
      - contains:
          path: spec.forwardAuth.authResponseHeaders
          content: X-authentik-username

  - it: should add no middlewares when the ingress is off
    set:
      bbe.ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0
