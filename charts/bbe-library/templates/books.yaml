{{- /*
The books' share, mounted whole, as bbe-media mounts its own. The share's own folder may let nobody but its owner in,
and root is mapped away, so the kubelet couldn't mount folders in it. Only the NAS user goes into it: the library is
in `books/`, and what's waiting to be added in `books-ingest/`
*/ -}}
{{- $nfs := .Values.bbe.library.nfs }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ printf "%s-bbe-library-share" .Release.Namespace | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.bbe.library.size }}
  accessModes:
    - ReadWriteMany
  # Removing the volume never removes the books on the NFS server
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  {{- with $nfs.mountOptions }}
  mountOptions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: bbe-library-share
  nfs:
    server: {{ $nfs.server }}
    path: {{ $nfs.path }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bbe-library-share
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: {{ printf "%s-bbe-library-share" .Release.Namespace | trunc 63 | trimSuffix "-" }}
  resources:
    requests:
      storage: {{ .Values.bbe.library.size }}
{{- $media := include "bbe-library.mediaVolume" . | fromJson }}
{{- with $media.spec }}
---
# bbe-media's share, read-only, so Shelfmark finds qBittorrent's finished downloads at the same /media path
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "bbe-library.downloadsVolumeName" $ }}
  labels:
    {{- include "bbe-library.labels" $ | nindent 4 }}
spec:
  capacity:
    storage: {{ .capacity.storage }}
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  {{- with .mountOptions }}
  mountOptions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  claimRef:
    namespace: {{ $.Release.Namespace }}
    name: bbe-library-downloads
  nfs:
    server: {{ .nfs.server }}
    path: {{ .nfs.path }}
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bbe-library-downloads
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" $ | nindent 4 }}
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: {{ include "bbe-library.downloadsVolumeName" $ }}
  resources:
    requests:
      storage: {{ .capacity.storage }}
{{- end }}
