{{- /*
The setup's pod, for the Job setting the library up and the CronJob keeping people in line. `mode` is the script's
MODE, `root` the chart's context
*/ -}}
{{- define "bbe-library.setupPod" -}}
{{- $root := .root -}}
restartPolicy: Never
securityContext:
  {{- include "bbe-library.runAsUser" $root | nindent 2 }}
  seccompProfile:
    type: RuntimeDefault
containers:
  # Calibre-Web-Automated's own image, for the python-ldap in its Python
  - name: setup
    image: "{{ $root.Values.bbe.library.calibre.image.repository }}:{{ $root.Values.bbe.library.calibre.image.tag }}"
    {{- if eq .mode "setup" }}
    # A failed setup waits before it ends, as Kubernetes retries a Job within seconds at first, when the apps of a
    # cluster that's only just come up may still be starting. The CronJob runs again on its schedule instead
    command:
      - sh
      - -c
      - /lsiopy/bin/python3 /scripts/setup.py || { echo "The setup is retried in $RETRY_DELAY seconds"; sleep "$RETRY_DELAY"; exit 1; }
    {{- else }}
    command:
      - /lsiopy/bin/python3
      - /scripts/setup.py
    {{- end }}
    env:
      - name: MODE
        value: {{ .mode }}
      - name: CALIBRE_URL
        value: http://{{ $root.Release.Name }}-calibre:8083
      - name: LIBRARY_DIR
        value: /share/books
      - name: ADMIN_USERNAME
        valueFrom:
          secretKeyRef:
            name: bbe-library-admin
            key: username
      - name: ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: bbe-library-admin
            key: password
      # bbe-auth's LDAP outpost, which the library binds to with its own account
      - name: LDAP_SERVER
        value: bbe-auth-ldap.bbe-auth.svc.cluster.local
      - name: LDAP_PORT
        value: "389"
      - name: LDAP_BASE_DN
        value: {{ include "bbe-library.ldapBaseDn" $root }}
      - name: LDAP_BIND_DN
        value: cn=books-ldap,ou=users,{{ include "bbe-library.ldapBaseDn" $root }}
      - name: LDAP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: bbe-library-auth
            key: ldap-password
      - name: READY_TIMEOUT
        value: {{ $root.Values.bbe.setup.readyTimeout | quote }}
      {{- if eq .mode "setup" }}
      - name: RETRY_DELAY
        value: {{ $root.Values.bbe.setup.retryDelay | quote }}
      {{- end }}
    {{- with $root.Values.bbe.setup.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    volumeMounts:
      - name: scripts
        mountPath: /scripts
        readOnly: true
volumes:
  - name: scripts
    configMap:
      name: bbe-library-setup
{{- end -}}

{{- if .Values.bbe.setup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: bbe-library-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
data:
  setup.py: |
    {{- .Files.Get "files/setup.py" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # A Job can't be changed once it exists, so each revision gets its own, which also runs it again
  name: bbe-library-setup-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.bbe.setup.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "bbe-library.labels" . | nindent 8 }}
        app.kubernetes.io/component: setup
    spec:
      {{- include "bbe-library.setupPod" (dict "root" . "mode" "setup") | nindent 6 }}
---
# Calibre-Web creates people on their first sign-in, so this gives them their admin rights and Send to eReader address
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bbe-library-people
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.bbe.setup.peopleSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "bbe-library.labels" . | nindent 12 }}
            app.kubernetes.io/component: people
        spec:
          {{- include "bbe-library.setupPod" (dict "root" . "mode" "people") | nindent 10 }}
{{- end }}
