{{- /*
The apps are served at <app>.<domain> with the domain's certificate, which bbe-networking makes Traefik's default.
Neither is behind authentik's forward auth: Calibre-Web-Automated signs people in against authentik's LDAP itself, so
e-readers and their apps can sign in to its OPDS feed and Kobo sync, and Shelfmark with OpenID Connect. bbe-networking's
dashboard lists them from their `gethomepage.dev/*` annotations
*/ -}}
{{- if .Values.bbe.ingress.enabled }}
{{- $domain := .Values.global.bbe.domain }}
{{- $apps := list
    (dict "app" "calibre" "port" 8083 "name" "Calibre-Web" "description" "Read the books" "icon" "calibre-web.png")
    (dict "app" "shelfmark" "port" 8084 "name" "Shelfmark" "description" "Find books" "icon" "mdi-book-search")
}}
{{- range $apps }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-{{ .app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" $ | nindent 4 }}
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: {{ .name }}
    gethomepage.dev/description: {{ .description }}
    gethomepage.dev/group: Read
    gethomepage.dev/icon: {{ .icon }}
    gethomepage.dev/pod-selector: app.kubernetes.io/component={{ .app }},app.kubernetes.io/instance={{ $.Release.Name }}
spec:
  tls:
    - hosts:
        - {{ .app }}.{{ $domain }}
  rules:
    - host: {{ .app }}.{{ $domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-{{ .app }}
                port:
                  number: {{ .port }}
{{- end }}
{{- end }}
