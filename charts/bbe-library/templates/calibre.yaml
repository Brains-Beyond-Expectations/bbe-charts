# Calibre-Web-Automated: the library people read, download and send books from, which adds what lands in its ingest
# folder by itself. Its config volume holds its users and settings, and SQLite, so it stays off NFS
#
# Its library and ingest folder are in the share, named in its dirs.json. Its start runs as root, which the share maps
# away, and checks the image's own /calibre-library, so that stays as it is
apiVersion: v1
kind: ConfigMap
metadata:
  name: bbe-library-calibre-dirs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
data:
  dirs.json: |
    {
      "ingest_folder": "/share/books-ingest",
      "calibre_library_dir": "/share/books",
      "tmp_conversion_dir": "/config/.cwa_conversion_tmp"
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bbe-library-calibre-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: {{ .Values.bbe.library.calibre.configSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-calibre
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: calibre
spec:
  replicas: 1
  # Two copies would write the same SQLite databases
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: calibre
  template:
    metadata:
      labels:
        {{- include "bbe-library.labels" . | nindent 8 }}
        app.kubernetes.io/component: calibre
    spec:
      # Its config volume is the NAS user's, as it doesn't change the owner of anything with NETWORK_SHARE_MODE
      securityContext:
        fsGroup: {{ .Values.bbe.library.user.gid | int }}
      containers:
        # It starts as root, like the linuxserver images it's built on, and runs Calibre-Web and the ingest as the NAS
        # user from PUID and PGID
        - name: calibre
          image: "{{ .Values.bbe.library.calibre.image.repository }}:{{ .Values.bbe.library.calibre.image.tag }}"
          envFrom:
            - configMapRef:
                name: bbe-library-user
          env:
            # The books are on NFS: no SQLite WAL, no chown of the share, and polling for new books, as inotify
            # doesn't see what other pods write
            - name: NETWORK_SHARE_MODE
              value: "true"
            # bbe's setup points it at the library the folders Job created, rather than it looking for one as root
            - name: DISABLE_LIBRARY_AUTOMOUNT
              value: "true"
            # Traefik is the one proxy in front of it
            - name: TRUSTED_PROXY_COUNT
              value: "1"
            - name: SESSION_COOKIE_SECURE
              value: "true"
          ports:
            - name: http
              containerPort: 8083
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login
              port: http
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            failureThreshold: 5
          {{- with .Values.bbe.library.calibre.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: share
              mountPath: /share
            - name: dirs
              mountPath: /app/calibre-web-automated/dirs.json
              subPath: dirs.json
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bbe-library-calibre-config
        - name: share
          persistentVolumeClaim:
            claimName: bbe-library-share
        - name: dirs
          configMap:
            name: bbe-library-calibre-dirs
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-calibre
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: calibre
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: calibre
  ports:
    - name: http
      port: 8083
      targetPort: http
