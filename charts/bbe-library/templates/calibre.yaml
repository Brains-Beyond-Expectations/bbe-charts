# Calibre-Web-Automated: the library people read, download and send books from, which adds what lands in its ingest
# folder by itself. Its config volume holds its users and settings, and SQLite, so it stays off NFS
#
# Its library and ingest folder are in the share, named in its dirs.json. Its start runs as root, which the share maps
# away, and checks the image's own /calibre-library, so that stays as it is
#
# It serves HTTPS itself, with a certificate from bbe's certificate authority, so even Traefik's connection to it is
# encrypted
apiVersion: v1
kind: ConfigMap
metadata:
  name: bbe-library-calibre-dirs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
data:
  dirs.json: |
    {
      "ingest_folder": "/share/books-ingest",
      "calibre_library_dir": "/share/books",
      "tmp_conversion_dir": "/config/.cwa_conversion_tmp"
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bbe-library-calibre-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: {{ .Values.bbe.library.calibre.configSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-calibre
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: calibre
spec:
  replicas: 1
  # Two copies would write the same SQLite databases
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: calibre
  template:
    metadata:
      labels:
        {{- include "bbe-library.labels" . | nindent 8 }}
        app.kubernetes.io/component: calibre
    spec:
      # Its config volume is the NAS user's, as it doesn't change the owner of anything with NETWORK_SHARE_MODE
      securityContext:
        fsGroup: {{ .Values.bbe.library.user.gid | int }}
      initContainers:
        # Calibre-Web serves HTTPS once its settings name a certificate and its key, which it reads when it starts. So
        # they're set before it starts, in its database. On a first install the database is created first, as CWA's
        # own start would
        - name: https
          image: "{{ .Values.bbe.library.calibre.image.repository }}:{{ .Values.bbe.library.calibre.image.tag }}"
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -f /config/app.db ]; then
                cd /app/calibre-web-automated
                /lsiopy/bin/python3 cps.py -d
              fi
              sqlite3 /config/app.db "UPDATE settings SET config_certfile = '/certificates/tls.crt', config_keyfile = '/certificates/tls.key'"
          env:
            - name: CALIBRE_DBPATH
              value: /config
            - name: HOME
              value: /tmp
          securityContext:
            {{- include "bbe-library.runAsUser" . | nindent 12 }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Creating the database starts Calibre-Web's Python, which used 117MB
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      containers:
        # It starts as root, like the linuxserver images it's built on, and runs Calibre-Web and the ingest as the NAS
        # user from PUID and PGID
        - name: calibre
          image: "{{ .Values.bbe.library.calibre.image.repository }}:{{ .Values.bbe.library.calibre.image.tag }}"
          envFrom:
            - configMapRef:
                name: bbe-library-user
          env:
            # The books are on NFS: no SQLite WAL, no chown of the share, and polling for new books, as inotify
            # doesn't see what other pods write
            - name: NETWORK_SHARE_MODE
              value: "true"
            # bbe's setup points it at the library the folders Job created, rather than it looking for one as root
            - name: DISABLE_LIBRARY_AUTOMOUNT
              value: "true"
            # Traefik is the one proxy in front of it
            - name: TRUSTED_PROXY_COUNT
              value: "1"
            - name: SESSION_COOKIE_SECURE
              value: "true"
          ports:
            - name: https
              containerPort: 8083
          startupProbe:
            httpGet:
              path: /login
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login
              port: https
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /login
              port: https
              scheme: HTTPS
            periodSeconds: 30
            failureThreshold: 5
          {{- with .Values.bbe.library.calibre.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: share
              mountPath: /share
            - name: dirs
              mountPath: /app/calibre-web-automated/dirs.json
              subPath: dirs.json
              readOnly: true
            # Not a sub-path, so cert-manager's renewals reach it. Calibre-Web reads them on every connection
            - name: certificate
              mountPath: /certificates
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bbe-library-calibre-config
        - name: share
          persistentVolumeClaim:
            claimName: bbe-library-share
        - name: dirs
          configMap:
            name: bbe-library-calibre-dirs
        - name: certificate
          secret:
            secretName: bbe-library-calibre-tls
            # Its key is only for the NAS user's group, which Calibre-Web runs as
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-calibre
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
    app.kubernetes.io/component: calibre
  {{- if .Values.bbe.ingress.enabled }}
  annotations:
    # Traefik connects to it over HTTPS too, checking its certificate with its ServersTransport
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: {{ .Release.Namespace }}-{{ .Release.Name }}-calibre@kubernetescrd
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: calibre
  ports:
    - name: https
      port: 8083
      targetPort: https
{{- if .Values.bbe.ingress.enabled }}
---
# How Traefik connects to Calibre-Web, which serves HTTPS itself: it checks Calibre-Web's certificate is bbe's
# certificate authority's, for its Service's name
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ .Release.Name }}-calibre
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
spec:
  serverName: {{ .Release.Name }}-calibre.{{ .Release.Namespace }}.svc
  rootCAs:
    - secret: bbe-library-calibre-tls
{{- end }}
---
# Calibre-Web's own certificate, from bbe's certificate authority, which Traefik and bbe's setup check it with. Traefik
# ends people's HTTPS with the domain's certificate, and connects to Calibre-Web over HTTPS again
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bbe-library-calibre
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
spec:
  secretName: bbe-library-calibre-tls
  dnsNames:
    - {{ .Release.Name }}-calibre
    - {{ .Release.Name }}-calibre.{{ .Release.Namespace }}
    - {{ .Release.Name }}-calibre.{{ .Release.Namespace }}.svc
    - {{ .Release.Name }}-calibre.{{ .Release.Namespace }}.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: bbe-ca
