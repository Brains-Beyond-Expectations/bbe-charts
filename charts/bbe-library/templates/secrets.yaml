{{- /*
The library's own admin password is generated on the first install and read back from the cluster on every upgrade.
The rest is copied from the packages bbe installs first, on every install and upgrade
*/ -}}
{{- $admin := (lookup "v1" "Secret" .Release.Namespace "bbe-library-admin").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: bbe-library-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.bbe.admin.username | b64enc }}
  # Calibre-Web asks for a digit, a lowercase and an uppercase letter and a special character
  password: {{ get $admin "password" | default (printf "%s.Aa1" (randAlphaNum 24) | b64enc) }}
{{- $auth := (lookup "v1" "Secret" "bbe-auth" "bbe-auth-authentik").data | default dict }}
{{- if $auth }}
---
# The password the library binds to bbe-auth's LDAP with, and Shelfmark's client secret in authentik
apiVersion: v1
kind: Secret
metadata:
  name: bbe-library-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
type: Opaque
data:
  ldap-password: {{ get $auth "BBE_BOOKS_LDAP_PASSWORD" }}
  shelfmark-client-secret: {{ get $auth "BBE_SHELFMARK_CLIENT_SECRET" }}
{{- end }}
{{- $apiKeys := (lookup "v1" "Secret" "bbe-media" "bbe-media-api-keys").data | default dict }}
{{- $mediaAdmin := (lookup "v1" "Secret" "bbe-media" "bbe-media-admin").data | default dict }}
{{- if and $apiKeys $mediaAdmin }}
---
# What Shelfmark searches Prowlarr and downloads with qBittorrent with. qBittorrent's API key isn't something
# Shelfmark can use, so it signs in as bbe-media's admin
apiVersion: v1
kind: Secret
metadata:
  name: bbe-library-media
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
type: Opaque
data:
  prowlarr-api-key: {{ get $apiKeys "prowlarr" }}
  qbittorrent-username: {{ get $mediaAdmin "username" }}
  qbittorrent-password: {{ get $mediaAdmin "password" }}
{{- end }}
{{- $ca := (lookup "v1" "Secret" "bbe-networking" "bbe-ca").data | default dict }}
{{- if $ca }}
---
# bbe's certificate authority, which Shelfmark trusts authentik's certificate with
apiVersion: v1
kind: ConfigMap
metadata:
  name: bbe-library-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- get $ca "ca.crt" | b64dec | nindent 4 }}
{{- end }}
