{{- if .Values.bbe.networkPolicy.enabled }}
# The library and Shelfmark are only reached through Traefik and by each other
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-library.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # The library, Shelfmark and the setup
    - from:
        - podSelector: {}
    # Traefik, serving them
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bbe-networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
{{- end }}
