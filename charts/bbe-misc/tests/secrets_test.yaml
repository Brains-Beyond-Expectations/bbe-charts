suite: test secrets
values:
  - ./values/required-values.yaml
templates:
  - secrets.yaml
release:
  name: bbe-misc
  namespace: bbe-misc
tests:
  - it: should generate Snipe-IT's key in the form Laravel reads, with 32 random bytes
    documentSelector:
      path: metadata.name
      value: bbe-misc-snipeit
    asserts:
      - matchRegex:
          path: data["app-key"]
          pattern: ^base64:[A-Za-z0-9+/]{43}=$
          decodeBase64: true

  - it: should generate the database's passwords and Snipe-IT's own admin password
    asserts:
      - matchRegex:
          path: data.password
          pattern: ^[A-Za-z0-9]{40}$
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-misc-mariadb
      - matchRegex:
          path: data["root-password"]
          pattern: ^[A-Za-z0-9]{40}$
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-misc-mariadb
      - equal:
          path: data.username
          value: snipeit-admin
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-misc-admin
      - matchRegex:
          path: data.password
          pattern: ^[A-Za-z0-9]{32}$
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-misc-admin

  - it: should only create what it can copy
    asserts:
      - hasDocuments:
          count: 3

  - it: should keep what it generated, and copy the password Snipe-IT binds to bbe-auth's LDAP with
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-misc-snipeit
            namespace: bbe-misc
          data:
            app-key: YmFzZTY0OmtlZXAtbWU=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-misc-mariadb
            namespace: bbe-misc
          data:
            password: ZGItcGFzc3dvcmQ=
            root-password: cm9vdC1wYXNzd29yZA==
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-misc-admin
            namespace: bbe-misc
          data:
            password: YWRtaW4tcGFzc3dvcmQ=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-authentik
            namespace: bbe-auth
          data:
            BBE_SNIPEIT_LDAP_PASSWORD: c25pcGVpdC1wYXNzd29yZA==
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: data["app-key"]
          value: base64:keep-me
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-misc-snipeit
      - equal:
          path: data
          value:
            password: ZGItcGFzc3dvcmQ=
            root-password: cm9vdC1wYXNzd29yZA==
        documentSelector:
          path: metadata.name
          value: bbe-misc-mariadb
      - equal:
          path: data.password
          value: admin-password
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-misc-admin
      - equal:
          path: data["ldap-password"]
          value: snipeit-password
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-misc-auth
