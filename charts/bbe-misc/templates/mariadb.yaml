{{- /*
Snipe-IT's database, from the official image. It runs as the image's mysql user (999), on a volume of the cluster's
default storage class
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: bbe-misc-mariadb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-misc.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  type: ClusterIP
  ports:
    - name: mariadb
      port: 3306
      targetPort: mariadb
  selector:
    app.kubernetes.io/name: bbe-misc
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bbe-misc-mariadb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-misc.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  serviceName: bbe-misc-mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bbe-misc
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mariadb
  template:
    metadata:
      labels:
        {{- include "bbe-misc.labels" . | nindent 8 }}
        app.kubernetes.io/component: mariadb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: "{{ .Values.bbe.misc.mariadb.image.repository }}:{{ .Values.bbe.misc.mariadb.image.tag }}"
          env:
            - name: MARIADB_DATABASE
              value: snipeit
            - name: MARIADB_USER
              value: snipeit
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bbe-misc-mariadb
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bbe-misc-mariadb
                  key: root-password
            # Upgrades the system tables when a new MariaDB version starts on older data
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
          ports:
            - name: mariadb
              containerPort: 3306
          # The image's own check, with the account its first start creates for it
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.bbe.misc.mariadb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "bbe-misc.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.bbe.misc.mariadb.size }}
