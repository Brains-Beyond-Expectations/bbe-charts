{{- /*
Snipe-IT's key, the database's passwords and Snipe-IT's own admin password are generated on the first install and read
back from the cluster on every upgrade. The LDAP password is copied from bbe-auth on every install and upgrade
*/ -}}
{{- $snipeit := (lookup "v1" "Secret" .Release.Namespace "bbe-misc-snipeit").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: bbe-misc-snipeit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-misc.labels" . | nindent 4 }}
type: Opaque
data:
  # Never changes after the first install, as Snipe-IT encrypts the LDAP password and its sessions with it
  app-key: {{ get $snipeit "app-key" | default (printf "base64:%s" (randBytes 32) | b64enc) }}
---
{{- $mariadb := (lookup "v1" "Secret" .Release.Namespace "bbe-misc-mariadb").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: bbe-misc-mariadb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-misc.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ get $mariadb "password" | default (randAlphaNum 40 | b64enc) }}
  root-password: {{ get $mariadb "root-password" | default (randAlphaNum 40 | b64enc) }}
---
{{- $admin := (lookup "v1" "Secret" .Release.Namespace "bbe-misc-admin").data | default dict }}
# Snipe-IT's own admin, for when authentik can't help
apiVersion: v1
kind: Secret
metadata:
  name: bbe-misc-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-misc.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.bbe.misc.snipeit.admin.username | b64enc }}
  password: {{ get $admin "password" | default (randAlphaNum 32 | b64enc) }}
{{- $auth := (lookup "v1" "Secret" "bbe-auth" "bbe-auth-authentik").data | default dict }}
{{- if $auth }}
---
# The password Snipe-IT binds to bbe-auth's LDAP with
apiVersion: v1
kind: Secret
metadata:
  name: bbe-misc-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-misc.labels" . | nindent 4 }}
type: Opaque
data:
  ldap-password: {{ get $auth "BBE_SNIPEIT_LDAP_PASSWORD" }}
{{- end }}
