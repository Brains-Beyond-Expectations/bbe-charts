{{- /*
bbe-music's own keys and logins are generated on the first install and read back from the cluster on every upgrade.
What it signs in to bbe-media with is copied from there, on every install and upgrade
*/ -}}
{{- $apiKeys := (lookup "v1" "Secret" .Release.Namespace "bbe-music-api-keys").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: bbe-music-api-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-music.labels" . | nindent 4 }}
type: Opaque
data:
  lidarr: {{ get $apiKeys "lidarr" | default (uuidv4 | replace "-" "" | b64enc) }}
  slskd: {{ get $apiKeys "slskd" | default (randAlphaNum 32 | b64enc) }}
---
{{- $slskd := (lookup "v1" "Secret" .Release.Namespace "bbe-music-slskd").data | default dict }}
# slskd's Soulseek account, which Soulseek registers on its first login, its own web login behind authentik, and the
# key its web sessions are signed with
apiVersion: v1
kind: Secret
metadata:
  name: bbe-music-slskd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-music.labels" . | nindent 4 }}
type: Opaque
data:
  # Soulseek names are taken for good until unused for 30 days, so it's one nobody else would pick
  soulseek-username: {{ get $slskd "soulseek-username" | default (printf "bbe%s" (randAlphaNum 12 | lower) | b64enc) }}
  soulseek-password: {{ get $slskd "soulseek-password" | default (randAlphaNum 24 | b64enc) }}
  username: {{ get $slskd "username" | default ("admin" | b64enc) }}
  password: {{ get $slskd "password" | default (randAlphaNum 24 | b64enc) }}
  jwt-key: {{ get $slskd "jwt-key" | default (randAlphaNum 48 | b64enc) }}
---
{{- $admin := (lookup "v1" "Secret" .Release.Namespace "bbe-music-admin").data | default dict }}
# Music Assistant's admin, who manages its people and players
apiVersion: v1
kind: Secret
metadata:
  name: bbe-music-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-music.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.bbe.admin.username | b64enc }}
  password: {{ get $admin "password" | default (randAlphaNum 24 | b64enc) }}
{{- $mediaKeys := (lookup "v1" "Secret" "bbe-media" "bbe-media-api-keys").data | default dict }}
{{- $mediaAdmin := (lookup "v1" "Secret" "bbe-media" "bbe-media-admin").data | default dict }}
{{- if and $mediaKeys $mediaAdmin }}
---
# What the setup connects Lidarr to bbe-media's Prowlarr with, and what Lidarr signs in to qBittorrent with. Lidarr
# 3.1.0 can't use qBittorrent's API key, so it signs in as bbe-media's admin
apiVersion: v1
kind: Secret
metadata:
  name: bbe-music-media
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-music.labels" . | nindent 4 }}
type: Opaque
data:
  prowlarr-api-key: {{ get $mediaKeys "prowlarr" }}
  qbittorrent-username: {{ get $mediaAdmin "username" }}
  qbittorrent-password: {{ get $mediaAdmin "password" }}
{{- end }}
