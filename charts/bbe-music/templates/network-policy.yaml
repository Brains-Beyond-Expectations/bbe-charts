{{- if .Values.bbe.networkPolicy.enabled }}
{{- $slskd := .Values.bbe.music.slskd }}
{{- $vpn := .Values.global.bbe.vpn }}
{{- $direct := and (not $vpn.enabled) $slskd.loadBalancerIP }}
{{- /*
The apps are only reached through Traefik and by each other, and Lidarr by bbe-media's Prowlarr. Music Assistant runs
on the node's network, which these policies don't cover. Policies add up: a pod accepts what any policy selecting it
allows
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-music.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # The apps talking to each other, and the setup
    - from:
        - podSelector: {}
    # Traefik, serving the apps
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bbe-networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-lidarr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-music.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lidarr
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # bbe-media's Prowlarr, pushing its indexers into Lidarr
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bbe-media
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prowlarr
      ports:
        - port: http
{{- if $direct }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-soulseek
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-music.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: slskd
  policyTypes:
    - Ingress
  ingress:
    # Soulseek peers anywhere, which the router forwards slskd's port to
    - ports:
        - port: soulseek
{{- end }}
{{- end }}
