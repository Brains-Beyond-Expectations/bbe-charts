suite: test network policies
values:
  - ./values/required-values.yaml
templates:
  - network-policy.yaml
release:
  name: bbe-music
  namespace: bbe-music
tests:
  - it: should let only the apps themselves and Traefik reach the apps
    documentSelector:
      path: metadata.name
      value: bbe-music
    asserts:
      - equal:
          path: spec.podSelector
          value: {}
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector: {}
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: bbe-networking
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: traefik

  - it: should let only bbe-media's Prowlarr reach Lidarr
    documentSelector:
      path: metadata.name
      value: bbe-music-lidarr
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: bbe-media
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prowlarr
              ports:
                - port: http

  - it: should let Soulseek peers anywhere reach slskd's port without the VPN
    set:
      global.bbe.vpn.enabled: false
      bbe.music.slskd.loadBalancerIP: 192.168.1.250
    documentSelector:
      path: metadata.name
      value: bbe-music-soulseek
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: slskd
      - equal:
          path: spec.ingress
          value:
            - ports:
                - port: soulseek

  - it: should keep slskd closed to peers with the VPN, which they reach through it
    set:
      global.bbe.vpn.enabled: true
      bbe.music.slskd.loadBalancerIP: 192.168.1.250
    asserts:
      - hasDocuments:
          count: 2

  - it: should add no policies when they're off
    set:
      bbe.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
