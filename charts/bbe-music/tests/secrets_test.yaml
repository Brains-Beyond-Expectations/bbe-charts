suite: test secrets
values:
  - ./values/required-values.yaml
templates:
  - templates/secrets.yaml
release:
  name: bbe-music
  namespace: bbe-music
tests:
  - it: should generate a Soulseek account nobody else would pick
    documentSelector:
      path: metadata.name
      value: bbe-music-slskd
    asserts:
      - matchRegex:
          path: data.soulseek-username
          pattern: ^bbe[a-z0-9]{12}$
          decodeBase64: true
      - matchRegex:
          path: data.jwt-key
          pattern: ^[A-Za-z0-9]{48}$
          decodeBase64: true

  - it: should keep its keys and logins on upgrades
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-music-api-keys
            namespace: bbe-music
          data:
            lidarr: bGlkYXJyLWtleQ==
            slskd: c2xza2Qta2V5
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-music-admin
            namespace: bbe-music
          data:
            password: YWRtaW4tcGFzc3dvcmQ=
    asserts:
      - equal:
          path: data
          value:
            lidarr: bGlkYXJyLWtleQ==
            slskd: c2xza2Qta2V5
        documentIndex: 0
      - equal:
          path: data.password
          value: admin-password
          decodeBase64: true
        documentIndex: 2

  - it: should only copy bbe-media's logins when bbe-media is installed
    asserts:
      - hasDocuments:
          count: 3
