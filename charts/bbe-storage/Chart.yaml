apiVersion: v2
name: bbe-storage
description: Longhorn storage for BBE clusters, as the default storage class
type: application
version: 0.0.1
keywords:
  - bbe
  - storage
  - longhorn
home: https://brains-beyond-expectations.github.io/bbe-charts
annotations:
  # bbe checks these before installing the chart, and sets up the nodes when something is missing
  bbe/prerequisites: |
    - name: longhorn-nodes
      description: iSCSI and filesystem tools on every node, and a directory for Longhorn's data
      talos:
        extensions:
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
        directories:
          - /var/mnt/longhorn
  # What else `bbe uninstall` deletes: Longhorn keeps its own namespace, and only lets itself be removed once its
  # deleting-confirmation-flag is set
  bbe/uninstall: |
    namespaces:
      - longhorn-system
    patches:
      - resource: settings.longhorn.io
        namespace: longhorn-system
        name: deleting-confirmation-flag
        patch: '{"value": "true"}'
    keeps:
      - The iSCSI and filesystem extensions, and the /var/mnt/longhorn directory, that bbe set up on each node
dependencies:
  - name: longhorn
    version: 1.12.1
    repository: https://charts.longhorn.io
