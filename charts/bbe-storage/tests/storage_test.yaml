suite: test bbe-storage
values:
  - ./values/required-values.yaml
release:
  name: bbe-storage
  namespace: bbe-storage
tests:
  - it: should create Longhorn's namespace with privileged pod security, kept on uninstall
    template: templates/namespace.yaml
    asserts:
      - equal:
          path: metadata.name
          value: longhorn-system
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: privileged
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: should make Longhorn the default storage class, with two copies of each volume
    template: charts/longhorn/templates/storageclass.yaml
    asserts:
      - matchRegex:
          path: data["storageclass.yaml"]
          pattern: 'storageclass.kubernetes.io/is-default-class: "true"'
      - matchRegex:
          path: data["storageclass.yaml"]
          pattern: 'numberOfReplicas: "2"'
      - equal:
          path: metadata.namespace
          value: longhorn-system

  - it: should store volumes in the directory bbe sets up on each node
    template: charts/longhorn/templates/default-setting.yaml
    asserts:
      - matchRegex:
          path: data["default-setting.yaml"]
          pattern: 'default-data-path: "/var/mnt/longhorn"'

  - it: should keep two copies of each volume, on one node only while there's no other, moved apart once there is
    template: charts/longhorn/templates/default-setting.yaml
    asserts:
      - matchRegex:
          path: data["default-setting.yaml"]
          pattern: 'default-replica-count: "2"'
      - matchRegex:
          path: data["default-setting.yaml"]
          pattern: 'replica-soft-anti-affinity: true'
      - matchRegex:
          path: data["default-setting.yaml"]
          pattern: 'replica-auto-balance: "best-effort"'
