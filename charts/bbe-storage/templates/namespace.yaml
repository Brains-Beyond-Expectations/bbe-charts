# Talos enforces the baseline pod security standard by default, and Longhorn's pods need privileged access to
# the nodes. The namespace is kept on uninstall, as deleting it would delete Longhorn's volumes with it.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.longhorn.namespaceOverride }}
  labels:
    app.kubernetes.io/name: bbe-storage
    app.kubernetes.io/instance: {{ .Release.Name }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    helm.sh/resource-policy: keep
