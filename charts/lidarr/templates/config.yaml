{{- if and .Values.config.enabled (not .Values.config.existingClaim) }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "lidarr.configClaimName" . }}
  namespace: {{ include "lidarr.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "lidarr.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with (include "lidarr.configAnnotations" .) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.config.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  accessModes:
    - {{ .Values.config.accessMode }}
  resources:
    requests:
      storage: {{ .Values.config.size }}
{{- end }}
