global:
  bbe:
    # -- The domain the cluster's apps are named under, which bbe-networking answers for. authentik signs people in at
    # auth.<domain>
    domain: bbe.home.arpa

bbe:
  networkPolicy:
    # -- Whether only what signs people in may reach authentik: Traefik, qBittorrent's nginx, Shelfmark, the LDAP clients
    # in bbe-media and bbe-library, and bbe-observability's Prometheus for its metrics.
    # The cluster's network has to enforce NetworkPolicies, which `bbe setup` turns on for the clusters it creates
    enabled: true
  auth:
    admin:
      # -- The username of the first admin, who can manage everyone else in authentik. Their first password is
      # generated into the `bbe-auth-admin` secret
      username:
      # -- The first admin's email address
      email:
    # -- The users bbe adds to authentik, with `bbe configure bbe-auth`. Each has a `username`, an `email`, an optional
    # `firstName` and `lastName`, `groups` (`users` or `admins`), and `secretFields.password`, the key of their first
    # password in the `bbe-auth-users` secret. People added in authentik's admin interface aren't listed here
    users: []
  postgres:
    image:
      # -- The PostgreSQL image, the official one
      repository: postgres
      # -- The PostgreSQL version. A new major version needs the database dumped and restored, which an upgrade doesn't
      tag: "18.6"
    # -- The size of authentik's database
    size: 2Gi
    resources:
      requests:
        # -- The memory to request for PostgreSQL
        memory: 128Mi
        # -- The CPU to request for PostgreSQL
        cpu: 50m
      limits:
        # -- The memory to limit PostgreSQL to
        memory: 512Mi
  ldap:
    image:
      # -- authentik's LDAP outpost, which Jellyfin signs people in with. Its version is authentik's
      repository: ghcr.io/goauthentik/ldap
      # -- The LDAP outpost's version, the same as authentik's
      tag: "2026.8.4"
    resources:
      requests:
        # -- The memory to request for the LDAP outpost
        memory: 64Mi
        # -- The CPU to request for the LDAP outpost
        cpu: 10m
      limits:
        # -- The memory to limit the LDAP outpost to
        memory: 128Mi
  setup:
    image:
      # -- The image to run the setup with, which only needs Python
      repository: python
      # -- The tag of the setup image
      tag: "3.13-alpine"
    # -- How long the setup waits for authentik to start and apply bbe's blueprint, in seconds
    readyTimeout: 1800
    # -- How many times the setup is retried when authentik couldn't be set up
    backoffLimit: 10
    # -- How long a failed setup waits before it's retried, in seconds. Kubernetes waits too, from 10 seconds at first,
    # doubling up to 6 minutes
    retryDelay: 300
    resources:
      requests:
        # -- The amount of memory to request for the setup pod
        memory: "64Mi"
        # -- The amount of CPU to request for the setup pod
        cpu: "50m"
      limits:
        # -- The amount of memory to limit the setup pod to
        memory: "128Mi"

authentik:
  # Its services are bbe-auth-server and bbe-auth-worker
  fullnameOverride: bbe-auth
  global:
    # Its secret key, database password, bootstrap admin and token, and the values bbe's blueprint reads, generated by
    # bbe-auth. They come after the chart's own, so they win
    envFrom:
      - secretRef:
          name: bbe-auth-authentik
    # Restarts authentik when bbe-auth-authentik gets a new key, which its pods only read when they start and bbe's
    # blueprint fails without. Raise it with every key added
    podAnnotations:
      bbe.home.arpa/authentik-secret-keys: "2"
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  authentik:
    postgresql:
      host: bbe-auth-postgres
      name: authentik
      user: authentik
  # bbe-auth runs PostgreSQL itself, from the official image
  postgresql:
    enabled: false
  # authentik doesn't deploy outposts itself, so it needs no access to the Kubernetes API. bbe-auth runs its LDAP
  # outpost
  serviceAccount:
    create: false
  blueprints:
    configMaps:
      - bbe-auth-blueprints
  server:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 1Gi
    # bbe's logo and sign-in background, which authentik serves from its media folder
    volumes:
      - name: branding
        configMap:
          name: bbe-auth-branding
    volumeMounts:
      - name: branding
        mountPath: /media/public/branding
        readOnly: true
  worker:
    automountServiceAccountToken: false
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        memory: 384Mi
        cpu: 100m
      limits:
        memory: 1Gi
