{{- /*
Keycloak signs people in at auth.<domain>, where oauth2-proxy takes their sign-in back under /oauth2. Traefik serves it
with the domain's certificate
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bbe-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-auth.labels" . | nindent 4 }}
  # bbe-networking's dashboard links to where admins manage people
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Keycloak
    gethomepage.dev/description: People, and how they sign in
    gethomepage.dev/group: Cluster
    gethomepage.dev/icon: keycloak.png
    gethomepage.dev/href: https://auth.{{ .Values.global.bbe.domain }}/admin/bbe/console/
    gethomepage.dev/pod-selector: app.kubernetes.io/name=keycloakx,app.kubernetes.io/instance={{ .Release.Name }}
spec:
  tls:
    - hosts:
        - auth.{{ .Values.global.bbe.domain }}
  rules:
    - host: auth.{{ .Values.global.bbe.domain }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: bbe-auth-oauth2-proxy
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bbe-auth-keycloak-http
                port:
                  name: http
