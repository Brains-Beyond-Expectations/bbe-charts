{{- /*
authentik signs people in at auth.<domain>, which forward auth sends them to as well. Traefik serves it with the
domain's certificate, and connects to authentik over HTTPS, checking authentik's own certificate (certificates.yaml)
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bbe-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-auth.labels" . | nindent 4 }}
  # bbe-networking's dashboard links to where people manage their account, and admins everyone
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: authentik
    gethomepage.dev/description: People, and how they sign in
    gethomepage.dev/group: Cluster
    gethomepage.dev/icon: authentik.png
    gethomepage.dev/href: https://auth.{{ .Values.global.bbe.domain }}/if/user/
    gethomepage.dev/pod-selector: app.kubernetes.io/name=authentik,app.kubernetes.io/component=server
spec:
  tls:
    - hosts:
        - auth.{{ .Values.global.bbe.domain }}
  rules:
    - host: auth.{{ .Values.global.bbe.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bbe-auth-server
                port:
                  name: https
---
{{- /*
The book library's forward auth is for its host only, so authentik's sign-in comes back to
/outpost.goauthentik.io/ on that host, to set its cookie there. Traefik sends that path to authentik, ahead of the
library's own Ingress, as its path is longer
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bbe-auth-books
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-auth.labels" . | nindent 4 }}
spec:
  tls:
    - hosts:
        - calibre.{{ .Values.global.bbe.domain }}
  rules:
    - host: calibre.{{ .Values.global.bbe.domain }}
      http:
        paths:
          - path: /outpost.goauthentik.io/
            pathType: Prefix
            backend:
              service:
                name: bbe-auth-server
                port:
                  name: https
