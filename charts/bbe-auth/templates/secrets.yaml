{{- /*
The secrets are generated on the first install and read back from the cluster on every upgrade, as authentik, its
database, Jellyfin and the book library keep using the ones they started with
*/ -}}
{{- $postgres := (lookup "v1" "Secret" .Release.Namespace "bbe-auth-postgres").data | default dict }}
{{- $authentik := (lookup "v1" "Secret" .Release.Namespace "bbe-auth-authentik").data | default dict }}
{{- /* The database password is in both secrets, so it's generated once */}}
{{- $databasePassword := get $postgres "password" | default (get $authentik "AUTHENTIK_POSTGRESQL__PASSWORD") | default (randAlphaNum 32 | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: bbe-auth-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-auth.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $databasePassword }}
---
# authentik's settings, which every authentik pod reads. `BBE_` ones are read by bbe's blueprint. Adding one needs
# `bbe.home.arpa/authentik-secret-keys` raised in values.yaml, as authentik's pods only read them when they start
apiVersion: v1
kind: Secret
metadata:
  name: bbe-auth-authentik
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-auth.labels" . | nindent 4 }}
type: Opaque
data:
  # Never changes after the first install, as authentik encrypts with it
  AUTHENTIK_SECRET_KEY: {{ get $authentik "AUTHENTIK_SECRET_KEY" | default (randAlphaNum 60 | b64enc) }}
  AUTHENTIK_POSTGRESQL__PASSWORD: {{ $databasePassword }}
  # authentik's own admin, akadmin, created on its first start, for when nobody else can sign in. The setup signs in
  # with its token
  AUTHENTIK_BOOTSTRAP_PASSWORD: {{ get $authentik "AUTHENTIK_BOOTSTRAP_PASSWORD" | default (randAlphaNum 24 | b64enc) }}
  AUTHENTIK_BOOTSTRAP_TOKEN: {{ get $authentik "AUTHENTIK_BOOTSTRAP_TOKEN" | default (randAlphaNum 60 | b64enc) }}
  AUTHENTIK_BOOTSTRAP_EMAIL: {{ printf "akadmin@%s" .Values.global.bbe.domain | b64enc }}
  AUTHENTIK_WEB__BASE_URL: {{ printf "https://auth.%s" .Values.global.bbe.domain | b64enc }}
  # authentik doesn't deploy outposts in the cluster itself
  AUTHENTIK_OUTPOSTS__DISCOVER: {{ "false" | b64enc }}
  BBE_DOMAIN: {{ .Values.global.bbe.domain | b64enc }}
  # The password Jellyfin binds to LDAP with, which bbe-media copies
  BBE_JELLYFIN_LDAP_PASSWORD: {{ get $authentik "BBE_JELLYFIN_LDAP_PASSWORD" | default (randAlphaNum 40 | b64enc) }}
  # The password the book library binds to LDAP with, and Shelfmark's OIDC client secret, which bbe-library copies
  BBE_BOOKS_LDAP_PASSWORD: {{ get $authentik "BBE_BOOKS_LDAP_PASSWORD" | default (randAlphaNum 40 | b64enc) }}
  BBE_SHELFMARK_CLIENT_SECRET: {{ get $authentik "BBE_SHELFMARK_CLIENT_SECRET" | default (randAlphaNum 64 | b64enc) }}
  # The token the LDAP outpost signs in to authentik with, which the setup gives authentik
  BBE_LDAP_OUTPOST_TOKEN: {{ get $authentik "BBE_LDAP_OUTPOST_TOKEN" | default (randAlphaNum 60 | b64enc) }}
---
{{- $admin := (lookup "v1" "Secret" .Release.Namespace "bbe-auth-admin").data | default dict }}
# The first admin's first password, which they can change in authentik
apiVersion: v1
kind: Secret
metadata:
  name: bbe-auth-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-auth.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.bbe.auth.admin.username | b64enc }}
  password: {{ get $admin "password" | default (randAlphaNum 24 | b64enc) }}
