{{- /*
The secrets are generated on the first install and read back from the cluster on every upgrade, as Keycloak, its
database and the apps keep using the ones they started with
*/ -}}
{{- $postgres := (lookup "v1" "Secret" .Release.Namespace "bbe-auth-postgres").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: bbe-auth-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-auth.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ get $postgres "password" | default (randAlphaNum 32 | b64enc) }}
---
{{- $keycloak := (lookup "v1" "Secret" .Release.Namespace "bbe-auth-keycloak").data | default dict }}
# Keycloak creates these in its master realm on its first start: a service account the setup signs in with, and an
# admin to sign in with when nobody in the realm can
apiVersion: v1
kind: Secret
metadata:
  name: bbe-auth-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-auth.labels" . | nindent 4 }}
type: Opaque
data:
  setup-client-id: {{ "bbe-setup" | b64enc }}
  setup-client-secret: {{ get $keycloak "setup-client-secret" | default (randAlphaNum 32 | b64enc) }}
  admin-username: {{ "bbe-admin" | b64enc }}
  admin-password: {{ get $keycloak "admin-password" | default (randAlphaNum 24 | b64enc) }}
---
{{- $admin := (lookup "v1" "Secret" .Release.Namespace "bbe-auth-admin").data | default dict }}
# The first admin's first password, which they change when they first sign in
apiVersion: v1
kind: Secret
metadata:
  name: bbe-auth-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-auth.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.bbe.auth.admin.username | b64enc }}
  password: {{ get $admin "password" | default (randAlphaNum 24 | b64enc) }}
---
{{- $clients := (lookup "v1" "Secret" .Release.Namespace "bbe-auth-clients").data | default dict }}
{{- $proxy := (lookup "v1" "Secret" .Release.Namespace "bbe-auth-oauth2-proxy").data | default dict }}
{{- /* oauth2-proxy's client secret is in both secrets, so it's generated once */}}
{{- $_ := set $clients "oauth2-proxy" (get $clients "oauth2-proxy" | default (get $proxy "client-secret") | default (randAlphaNum 32 | b64enc)) }}
# A secret per client, which the setup sets in Keycloak and the app signs in with
apiVersion: v1
kind: Secret
metadata:
  name: bbe-auth-clients
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-auth.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range include "bbe-auth.clients" . | fromJsonArray }}
  {{ .clientId }}: {{ get $clients .clientId | default (randAlphaNum 32 | b64enc) }}
  {{- end }}
---
# oauth2-proxy reads its client from here, and encrypts its cookie with the cookie secret
apiVersion: v1
kind: Secret
metadata:
  name: bbe-auth-oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-auth.labels" . | nindent 4 }}
type: Opaque
data:
  client-id: {{ "oauth2-proxy" | b64enc }}
  client-secret: {{ get $clients "oauth2-proxy" }}
  cookie-secret: {{ get $proxy "cookie-secret" | default (randAlphaNum 32 | b64enc) }}
