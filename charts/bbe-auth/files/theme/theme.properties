# bbe's sign-in page: Keycloak's own login theme, with the Brains Beyond Expectations brain and colours on top
parent=keycloak.v2
import=common/keycloak
# Keycloak's stylesheets first, then bbe's overriding them
styles=css/styles.css css/bbe.css
# The page is always dark, over the banner, so Keycloak doesn't switch to its light colours
darkMode=false
