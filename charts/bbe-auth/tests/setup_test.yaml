suite: test setup
values:
  - ./values/required-values.yaml
templates:
  - setup.yaml
release:
  name: bbe-auth
  namespace: bbe-auth
  revision: 3
tests:
  - it: should run the setup as a new Job for every revision, signing in to authentik with its bootstrap token
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.name
          value: bbe-auth-setup-3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTHENTIK_URL
            value: http://bbe-auth-server
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTHENTIK_TOKEN
            valueFrom:
              secretKeyRef:
                name: bbe-auth-authentik
                key: AUTHENTIK_BOOTSTRAP_TOKEN

  - it: should create the first admin before the users bbe configure added
    documentSelector:
      path: kind
      value: Job
    set:
      bbe.auth.users:
        - username: alice
          email: alice@example.com
          groups: [users]
          secretFields:
            password: alice.password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USERS
            value: '[{"email":"umbo@example.com","groups":["admins"],"secretFields":{"password":"first-admin"},"username":"umbo"},{"email":"alice@example.com","groups":["users"],"secretFields":{"password":"alice.password"},"username":"alice"}]'

  - it: should give the setup the blueprint the worker applies, and the people's first passwords
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: blueprints
            configMap:
              name: bbe-auth-blueprints
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BLUEPRINT_FILE
            value: /blueprints/bbe.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: user-passwords
            projected:
              sources:
                - secret:
                    name: bbe-auth-admin
                    items:
                      - key: password
                        path: first-admin
                - secret:
                    name: bbe-auth-users
                    optional: true

  - it: should ship the setup script
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["setup.py"]
          pattern: def configure_users
