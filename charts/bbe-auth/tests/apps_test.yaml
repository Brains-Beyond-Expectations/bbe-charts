suite: test apps
values:
  - ./values/required-values.yaml
release:
  name: bbe-auth
  namespace: bbe-auth
tests:
  - it: should give authentik's server and worker bbe's settings after the chart's own
    template: charts/authentik/templates/worker/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[1]
          value:
            secretRef:
              name: bbe-auth-authentik
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: blueprints-cm-bbe-auth-blueprints
            mountPath: /blueprints/mounted/cm-bbe-auth-blueprints
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: should restart authentik when its secret gets a new key, which it reads on start
    templates:
      - charts/authentik/templates/server/deployment.yaml
      - charts/authentik/templates/worker/deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["bbe.home.arpa/authentik-secret-keys"]
          value: "3"

  - it: should serve bbe's logo and background from authentik's media folder
    template: charts/authentik/templates/server/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: branding
            mountPath: /media/public/branding
            readOnly: true

  - it: should use bbe-auth's PostgreSQL, not the chart's
    template: charts/authentik/templates/secret.yaml
    asserts:
      - equal:
          path: data.AUTHENTIK_POSTGRESQL__HOST
          value: bbe-auth-postgres
          decodeBase64: true
      - equal:
          path: data.AUTHENTIK_POSTGRESQL__USER
          value: authentik
          decodeBase64: true

  - it: should serve authentik at auth.<domain>, and list it on the dashboard
    template: templates/ingress.yaml
    set:
      global.bbe.domain: lab.home.arpa
    documentSelector:
      path: metadata.name
      value: bbe-auth
    asserts:
      - equal:
          path: spec.rules[0].host
          value: auth.lab.home.arpa
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value:
            name: bbe-auth-server
            port:
              name: https
      - equal:
          path: metadata.annotations["gethomepage.dev/href"]
          value: https://auth.lab.home.arpa/if/user/

  - it: should run the LDAP outpost with the token the setup gives authentik
    template: templates/ldap.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTHENTIK_TOKEN
            valueFrom:
              secretKeyRef:
                name: bbe-auth-authentik
                key: BBE_LDAP_OUTPOST_TOKEN
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/goauthentik/ldap:2026.8.4

  - it: should start the LDAP outpost once authentik takes its token
    template: templates/ldap.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-authentik
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: /api/v3/outposts/instances/
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: AUTHENTIK_TOKEN
            valueFrom:
              secretKeyRef:
                name: bbe-auth-authentik
                key: BBE_LDAP_OUTPOST_TOKEN

  - it: should serve only LDAPS outside the outpost's pod, on its usual port
    template: templates/ldap.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: ldaps
              port: 636
              targetPort: ldaps

  - it: should have the LDAP outpost reach authentik over HTTPS, trusting only bbe's certificate authority
    template: templates/ldap.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTHENTIK_HOST
            value: https://bbe-auth-server
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_FILE
            value: /certificates/ca.crt
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTHENTIK_INSECURE
            value: "true"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: --cacert /certificates/ca.crt
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ca
            secret:
              secretName: bbe-ca-cert

  - it: should give authentik's server and LDAP outpost certificates from bbe's certificate authority, for their Services
    template: templates/certificates.yaml
    release:
      namespace: bbe-auth
    asserts:
      - equal:
          path: spec.dnsNames
          value:
            - bbe-auth-server
            - bbe-auth-server.bbe-auth
            - bbe-auth-server.bbe-auth.svc
            - bbe-auth-server.bbe-auth.svc.cluster.local
        documentIndex: 0
      - equal:
          path: spec.dnsNames
          value:
            - bbe-auth-ldap
            - bbe-auth-ldap.bbe-auth
            - bbe-auth-ldap.bbe-auth.svc
            - bbe-auth-ldap.bbe-auth.svc.cluster.local
        documentIndex: 1
      - equal:
          path: spec.issuerRef
          value:
            kind: ClusterIssuer
            name: bbe-ca
        documentIndex: 0

  - it: should have Traefik reach authentik over HTTPS, checking its certificate for its Service's name
    template: templates/certificates.yaml
    release:
      namespace: bbe-auth
    documentSelector:
      path: kind
      value: ServersTransport
    asserts:
      - equal:
          path: spec
          value:
            serverName: bbe-auth-server.bbe-auth.svc
            rootCAs:
              - secret: bbe-ca-cert

  - it: should point Traefik at that ServersTransport for authentik's server
    template: charts/authentik/templates/server/service.yaml
    asserts:
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/service.serverstransport"]
          value: bbe-auth-bbe-auth-server@kubernetescrd
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/service.serversscheme"]
          value: https

  - it: should have the worker import authentik's certificates from /certs, readable only by authentik
    template: charts/authentik/templates/worker/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: server-certificate
            mountPath: /certs/bbe-auth-server
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ldap-certificate
            mountPath: /certs/bbe-auth-ldap
            readOnly: true
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: should ship bbe's blueprint and images
    template: templates/blueprints.yaml
    asserts:
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "mode: forward_domain"
        documentIndex: 0
      - exists:
          path: binaryData["background.webp"]
        documentIndex: 1

  - it: should give Snipe-IT an LDAP account, which may search everyone and bind
    template: templates/blueprints.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "username: snipeit-ldap"
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "key: !Env BBE_SNIPEIT_LDAP_PASSWORD"
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "search_full_directory\\n        user: !KeyOf snipeit-ldap"
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "target: !KeyOf ldap-app\\n      user: !KeyOf snipeit-ldap"

  - it: should give the book library an LDAP account and Shelfmark an OpenID Connect client
    template: templates/blueprints.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "username: books-ldap"
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "key: !Env BBE_BOOKS_LDAP_PASSWORD"
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "client_secret: !Env BBE_SHELFMARK_CLIENT_SECRET"
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "grant_types:\\n        - authorization_code"
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: 'url: !Format \["https://shelfmark.%s/api/auth/oidc/callback", !Context domain\]'

  - it: should put the book library behind forward auth of its own, for users and admins, served by the outpost
    template: templates/blueprints.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: 'mode: forward_single\n      external_host: !Format \["https://calibre.%s", !Context domain\]'
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "target: !KeyOf forward-auth-books-app\\n      group: !KeyOf users"
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "target: !KeyOf forward-auth-books-app\\n      group: !KeyOf admins"
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "providers:\\n        - !KeyOf forward-auth\\n        - !KeyOf forward-auth-books"

  - it: should send the book library's sign-in back to authentik, on the library's host
    template: templates/ingress.yaml
    set:
      global.bbe.domain: lab.home.arpa
    documentSelector:
      path: metadata.name
      value: bbe-auth-books
    asserts:
      - equal:
          path: spec.rules[0]
          value:
            host: calibre.lab.home.arpa
            http:
              paths:
                - path: /outpost.goauthentik.io/
                  pathType: Prefix
                  backend:
                    service:
                      name: bbe-auth-server
                      port:
                        name: https
      - notExists:
          path: metadata.annotations

  - it: should give Open WebUI an OpenID Connect client, for users and admins
    template: templates/blueprints.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "client_id: open-webui\\n      client_secret: !Env BBE_OPEN_WEBUI_CLIENT_SECRET"
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: 'url: !Format \["https://ai.%s/oauth/oidc/callback", !Context domain\]'
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "target: !KeyOf open-webui-app\\n      group: !KeyOf users"
      - matchRegex:
          path: data["bbe.yaml"]
          pattern: "target: !KeyOf open-webui-app\\n      group: !KeyOf admins"

  - it: should run PostgreSQL as its own user with a read-only root, for authentik
    template: templates/postgres.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 999
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DB
            value: authentik

  - it: should refuse a first admin's name in upper case
    set:
      bbe.auth.admin.username: Umbo
    asserts:
      - failedTemplate: {}

  - it: should require the first admin's email
    set:
      bbe.auth.admin.email: null
    asserts:
      - failedTemplate: {}
