suite: test apps
values:
  - ./values/required-values.yaml
release:
  name: bbe-auth
  namespace: bbe-auth
tests:
  - it: should name Keycloak after its address under the domain, and serve it from /
    template: charts/keycloakx/templates/statefulset.yaml
    set:
      global.bbe.domain: lab.home.arpa
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_HOSTNAME
            value: https://auth.lab.home.arpa
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_HTTP_RELATIVE_PATH
            value: /
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_PROXY_HEADERS
            value: xforwarded
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_DB_URL_HOST
            value: bbe-auth-postgres

  - it: should have oauth2-proxy sign in at the domain and fetch tokens from Keycloak's service
    template: charts/oauth2-proxy/templates/deployment.yaml
    set:
      global.bbe.domain: lab.home.arpa
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oidc-issuer-url=https://auth.lab.home.arpa/realms/bbe
      - contains:
          path: spec.template.spec.containers[0].args
          content: --login-url=https://auth.lab.home.arpa/realms/bbe/protocol/openid-connect/auth
      - contains:
          path: spec.template.spec.containers[0].args
          content: --redeem-url=http://bbe-auth-keycloak-http.bbe-auth.svc/realms/bbe/protocol/openid-connect/token
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cookie-domain=.lab.home.arpa
      - contains:
          path: spec.template.spec.containers[0].args
          content: --allowed-group=admins

  - it: should serve Keycloak at auth.<domain>, with oauth2-proxy under /oauth2
    template: templates/ingress.yaml
    set:
      global.bbe.domain: lab.home.arpa
    asserts:
      - equal:
          path: spec.rules[0].host
          value: auth.lab.home.arpa
      - equal:
          path: spec.rules[0].http.paths[0]
          value:
            path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: bbe-auth-oauth2-proxy
                port:
                  name: http
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.name
          value: bbe-auth-keycloak-http

  - it: should run PostgreSQL as its own user with a read-only root
    template: templates/postgres.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 999
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].image
          value: postgres:18.6

  - it: should refuse admin as the first admin's name, which is bbe-media's own login
    set:
      bbe.auth.admin.username: admin
    asserts:
      - failedTemplate: {}

  - it: should refuse a first admin's name in upper case, as Keycloak would change it
    set:
      bbe.auth.admin.username: Umbo
    asserts:
      - failedTemplate: {}

  - it: should require the first admin's email
    set:
      bbe.auth.admin.email: null
    asserts:
      - failedTemplate: {}
