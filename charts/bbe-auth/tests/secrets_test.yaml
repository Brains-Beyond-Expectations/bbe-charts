suite: test secrets
values:
  - ./values/required-values.yaml
templates:
  - secrets.yaml
release:
  name: bbe-auth
  namespace: bbe-auth
tests:
  - it: should generate the database's password
    documentSelector:
      path: metadata.name
      value: bbe-auth-postgres
    asserts:
      - matchRegex:
          path: data.password
          pattern: ^[A-Za-z0-9]{32}$
          decodeBase64: true

  - it: should generate Keycloak's setup client and admin
    documentSelector:
      path: metadata.name
      value: bbe-auth-keycloak
    asserts:
      - equal:
          path: data["setup-client-id"]
          value: bbe-setup
          decodeBase64: true
      - matchRegex:
          path: data["setup-client-secret"]
          pattern: ^[A-Za-z0-9]{32}$
          decodeBase64: true
      - equal:
          path: data["admin-username"]
          value: bbe-admin
          decodeBase64: true

  - it: should generate the first admin's first password
    documentSelector:
      path: metadata.name
      value: bbe-auth-admin
    asserts:
      - equal:
          path: data.username
          value: umbo
          decodeBase64: true
      - matchRegex:
          path: data.password
          pattern: ^[A-Za-z0-9]{24}$
          decodeBase64: true

  - it: should generate a secret for oauth2-proxy and every app's client
    documentSelector:
      path: metadata.name
      value: bbe-auth-clients
    set:
      bbe.auth.clients:
        - clientId: jellyfin
          host: jellyfin
          redirectPath: /sso/OID/redirect/bbe
        - clientId: seerr
          host: seerr
          redirectPath: /login
    asserts:
      - matchRegex:
          path: data["oauth2-proxy"]
          pattern: ^[A-Za-z0-9]{32}$
          decodeBase64: true
      - matchRegex:
          path: data.jellyfin
          pattern: ^[A-Za-z0-9]{32}$
          decodeBase64: true
      - matchRegex:
          path: data.seerr
          pattern: ^[A-Za-z0-9]{32}$
          decodeBase64: true

  - it: should keep every secret already in the cluster on upgrades, and give oauth2-proxy its client's secret
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-postgres
            namespace: bbe-auth
          data:
            password: ZGItcGFzc3dvcmQ=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-keycloak
            namespace: bbe-auth
          data:
            setup-client-secret: c2V0dXAtc2VjcmV0
            admin-password: YWRtaW4tcGFzc3dvcmQ=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-admin
            namespace: bbe-auth
          data:
            password: Zmlyc3QtcGFzc3dvcmQ=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-clients
            namespace: bbe-auth
          data:
            oauth2-proxy: cHJveHktc2VjcmV0
            jellyfin: amVsbHlmaW4tc2VjcmV0
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-oauth2-proxy
            namespace: bbe-auth
          data:
            client-secret: b2xkLXByb3h5LXNlY3JldA==
            cookie-secret: Y29va2llLXNlY3JldA==
    asserts:
      - equal:
          path: data.password
          value: db-password
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-auth-postgres
      - equal:
          path: data["setup-client-secret"]
          value: setup-secret
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-auth-keycloak
      - equal:
          path: data["admin-password"]
          value: admin-password
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-auth-keycloak
      - equal:
          path: data.password
          value: first-password
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-auth-admin
      - equal:
          path: data.jellyfin
          value: jellyfin-secret
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-auth-clients
      - equal:
          path: data["client-secret"]
          value: proxy-secret
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-auth-oauth2-proxy
      - equal:
          path: data["cookie-secret"]
          value: cookie-secret
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-auth-oauth2-proxy
