suite: test secrets
values:
  - ./values/required-values.yaml
templates:
  - secrets.yaml
release:
  name: bbe-auth
  namespace: bbe-auth
tests:
  - it: should give PostgreSQL and authentik the same generated database password
    asserts:
      - matchRegex:
          path: data.password
          pattern: ^[A-Za-z0-9]{32}$
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-auth-postgres
      - matchRegex:
          path: data.AUTHENTIK_POSTGRESQL__PASSWORD
          pattern: ^[A-Za-z0-9]{32}$
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-auth-authentik

  - it: should give authentik its settings, from the domain
    documentSelector:
      path: metadata.name
      value: bbe-auth-authentik
    set:
      global.bbe.domain: lab.home.arpa
    asserts:
      - matchRegex:
          path: data.AUTHENTIK_SECRET_KEY
          pattern: ^[A-Za-z0-9]{60}$
          decodeBase64: true
      - equal:
          path: data.AUTHENTIK_WEB__BASE_URL
          value: https://auth.lab.home.arpa
          decodeBase64: true
      - equal:
          path: data.BBE_DOMAIN
          value: lab.home.arpa
          decodeBase64: true
      - equal:
          path: data.AUTHENTIK_OUTPOSTS__DISCOVER
          value: "false"
          decodeBase64: true
      - matchRegex:
          path: data.AUTHENTIK_BOOTSTRAP_TOKEN
          pattern: ^[A-Za-z0-9]{60}$
          decodeBase64: true
      - matchRegex:
          path: data.BBE_LDAP_OUTPOST_TOKEN
          pattern: ^[A-Za-z0-9]{60}$
          decodeBase64: true

  - it: should generate the first admin's first password
    documentSelector:
      path: metadata.name
      value: bbe-auth-admin
    asserts:
      - equal:
          path: data.username
          value: umbo
          decodeBase64: true
      - matchRegex:
          path: data.password
          pattern: ^[A-Za-z0-9]{24}$
          decodeBase64: true

  - it: should keep every secret already in the cluster on upgrades
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-postgres
            namespace: bbe-auth
          data:
            password: ZGItcGFzc3dvcmQ=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-authentik
            namespace: bbe-auth
          data:
            AUTHENTIK_SECRET_KEY: c2VjcmV0LWtleQ==
            AUTHENTIK_BOOTSTRAP_PASSWORD: YWRtaW4tcGFzc3dvcmQ=
            AUTHENTIK_BOOTSTRAP_TOKEN: Ym9vdHN0cmFwLXRva2Vu
            BBE_JELLYFIN_LDAP_PASSWORD: amVsbHlmaW4tcGFzc3dvcmQ=
            BBE_LDAP_OUTPOST_TOKEN: b3V0cG9zdC10b2tlbg==
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-admin
            namespace: bbe-auth
          data:
            password: Zmlyc3QtcGFzc3dvcmQ=
    asserts:
      - equal:
          path: data.AUTHENTIK_POSTGRESQL__PASSWORD
          value: db-password
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-auth-authentik
      - equal:
          path: data
          value:
            AUTHENTIK_SECRET_KEY: c2VjcmV0LWtleQ==
            AUTHENTIK_POSTGRESQL__PASSWORD: ZGItcGFzc3dvcmQ=
            AUTHENTIK_BOOTSTRAP_PASSWORD: YWRtaW4tcGFzc3dvcmQ=
            AUTHENTIK_BOOTSTRAP_TOKEN: Ym9vdHN0cmFwLXRva2Vu
            AUTHENTIK_BOOTSTRAP_EMAIL: YWthZG1pbkBiYmUuaG9tZS5hcnBh
            AUTHENTIK_WEB__BASE_URL: aHR0cHM6Ly9hdXRoLmJiZS5ob21lLmFycGE=
            AUTHENTIK_OUTPOSTS__DISCOVER: ZmFsc2U=
            BBE_DOMAIN: YmJlLmhvbWUuYXJwYQ==
            BBE_JELLYFIN_LDAP_PASSWORD: amVsbHlmaW4tcGFzc3dvcmQ=
            BBE_LDAP_OUTPOST_TOKEN: b3V0cG9zdC10b2tlbg==
        documentSelector:
          path: metadata.name
          value: bbe-auth-authentik
      - equal:
          path: data.password
          value: first-password
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-auth-admin
