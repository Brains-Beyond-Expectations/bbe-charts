suite: test node storage
# The library is on the NAS, and the node holds 31Gi together: five 1Gi configs, Jellyfin's 3Gi config and
# 2Gi cache, Seerr's 1Gi config, and qBittorrent's 20Gi of downloads in progress
values:
  - ./values/required-values.yaml
release:
  name: bbe-media
  namespace: bbe-media
tests:
  - it: should give each app a 1Gi config volume
    templates:
      - charts/sonarr/templates/config.yaml
      - charts/radarr/templates/config.yaml
      - charts/prowlarr/templates/config.yaml
      - charts/bazarr/templates/config.yaml
      - charts/qbittorrent/templates/config.yaml
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi

  - it: should keep qBittorrent's downloads in progress on a 20Gi node volume
    template: charts/qbittorrent/templates/incomplete.yaml
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 20Gi
      - notExists:
          path: spec.storageClassName

  - it: should mount qBittorrent's downloads in progress
    template: charts/qbittorrent/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: incomplete
            mountPath: /incomplete

  - it: should bound Jellyfin's config and transcoding cache
    template: templates/jellyfin.yaml
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 3Gi
        documentSelector:
          path: metadata.name
          value: bbe-media-jellyfin-config
      - equal:
          path: spec.resources.requests.storage
          value: 2Gi
        documentSelector:
          path: metadata.name
          value: bbe-media-jellyfin-cache

  - it: should give Seerr a 1Gi config volume
    template: charts/seerr-chart/templates/persistentvolumeclaim.yaml
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
