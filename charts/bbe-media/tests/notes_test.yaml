suite: test notes
values:
  - ./values/required-values.yaml
templates:
  - NOTES.txt
release:
  name: bbe-media
  namespace: bbe-media
tests:
  - it: should say who signs in to which app with authentik, and where bbe's login still works
    asserts:
      - matchRegexRaw:
          pattern: "https://<app>.bbe.home.arpa"
      - matchRegexRaw:
          pattern: "Sonarr, Radarr, Prowlarr, Bazarr and qBittorrent let in its admins"
      - matchRegexRaw:
          pattern: "Seerr signs people in through Jellyfin"

  - it: should give every app's login without single sign-on
    set:
      global.bbe.sso.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "Every app's web UI uses the same login:\n  username: admin"
      - notMatchRegexRaw:
          pattern: authentik

  - it: should say Jellyfin transcodes on a GPU, and how to see which nodes offer one
    template: templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "Jellyfin transcodes on a GPU, so it only runs on a node offering gpu.intel.com/i915"
      - matchRegexRaw:
          pattern: 'GPU:\.status\.allocatable\.gpu\\\.intel\\\.com/i915'

  - it: should say Jellyfin transcodes on the CPU when it's allowed and no node offers a GPU
    template: templates/NOTES.txt
    set:
      bbe.media.jellyfin.transcoding.allowCpu: true
    asserts:
      - matchRegexRaw:
          pattern: "Jellyfin transcodes on the CPU, as no node offered gpu.intel.com/i915. Once one does, bbe upgrade moves it"
