suite: test secrets
values:
  - ./values/required-values.yaml
templates:
  - secrets.yaml
release:
  name: bbe-media
  namespace: bbe-media
tests:
  - it: should generate an API key for every app
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: bbe-media-api-keys
      - matchRegex:
          path: data.sonarr
          pattern: ^[0-9a-f]{32}$
          decodeBase64: true
      - matchRegex:
          path: data.radarr
          pattern: ^[0-9a-f]{32}$
          decodeBase64: true
      - matchRegex:
          path: data.prowlarr
          pattern: ^[0-9a-f]{32}$
          decodeBase64: true
      - matchRegex:
          path: data.bazarr
          pattern: ^[0-9a-f]{32}$
          decodeBase64: true

  - it: should generate the admin login
    documentIndex: 1
    set:
      bbe.admin.username: media-admin
    asserts:
      - equal:
          path: metadata.name
          value: bbe-media-admin
      - equal:
          path: data.username
          value: bWVkaWEtYWRtaW4=
      - matchRegex:
          path: data.password
          pattern: ^[A-Za-z0-9]{24}$
          decodeBase64: true

  - it: should keep the keys and password already in the cluster on upgrades
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-media-api-keys
            namespace: bbe-media
          data:
            sonarr: ZXhpc3Rpbmctc29uYXJy
            radarr: ZXhpc3RpbmctcmFkYXJy
            prowlarr: ZXhpc3RpbmctcHJvd2xhcnI=
            bazarr: ZXhpc3RpbmctYmF6YXJy
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-media-admin
            namespace: bbe-media
          data:
            username: YWRtaW4=
            password: ZXhpc3RpbmctcGFzc3dvcmQ=
    asserts:
      - equal:
          path: data.sonarr
          value: ZXhpc3Rpbmctc29uYXJy
        documentIndex: 0
      - equal:
          path: data.bazarr
          value: ZXhpc3RpbmctYmF6YXJy
        documentIndex: 0
      - equal:
          path: data.password
          value: ZXhpc3RpbmctcGFzc3dvcmQ=
        documentIndex: 1
