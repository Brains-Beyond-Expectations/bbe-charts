suite: test network policies
values:
  - ./values/required-values.yaml
templates:
  - network-policy.yaml
release:
  name: bbe-media
  namespace: bbe-media
tests:
  - it: should let only the apps themselves and Traefik reach the apps
    documentSelector:
      path: metadata.name
      value: bbe-media
    asserts:
      - equal:
          path: spec.podSelector
          value: {}
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector: {}
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: bbe-networking
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: traefik

  - it: should let bbe-music and bbe-library reach Prowlarr and qBittorrent's own port, not its nginx
    documentSelector:
      path: metadata.name
      value: bbe-media-qbittorrent
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: qbittorrent
            app.kubernetes.io/instance: bbe-media
      - equal:
          path: spec.ingress
          value:
            - from:
              - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: bbe-music
              - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: bbe-library
              ports:
                - port: http

  - it: should let bbe-music and bbe-library reach Prowlarr
    documentSelector:
      path: metadata.name
      value: bbe-media-prowlarr
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: prowlarr
      - lengthEqual:
          path: spec.ingress[0].from
          count: 2

  - it: should let only bbe-library reach FlareSolverr
    documentSelector:
      path: metadata.name
      value: bbe-media-flaresolverr
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
              - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: bbe-library
              ports:
                - port: http

  - it: should add no policies when they're off
    set:
      bbe.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
