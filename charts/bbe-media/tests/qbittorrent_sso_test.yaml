suite: test qBittorrent behind single sign-on
values:
  - ./values/required-values.yaml
release:
  name: bbe-media
  namespace: bbe-media
tests:
  - it: should run oauth2-proxy in qBittorrent's pod, reading bbe-auth's cookie under the domain
    template: charts/qbittorrent/templates/deployment.yaml
    set:
      global.bbe.domain: lab.home.arpa
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: sso
      - contains:
          path: spec.template.spec.containers[1].args
          content: --upstream=http://127.0.0.1:8080
      - contains:
          path: spec.template.spec.containers[1].args
          content: --cookie-name=_bbe_sso
      - contains:
          path: spec.template.spec.containers[1].args
          content: --cookie-domain=.lab.home.arpa
      - contains:
          path: spec.template.spec.containers[1].args
          content: --allowed-group=admins

  - it: should let only qBittorrent's own pod skip its login, and give it the API key
    template: charts/qbittorrent/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: WEBUI_LOCAL_HOST_AUTH
            value: "false"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: WEBUI_API_KEY
            valueFrom:
              secretKeyRef:
                name: bbe-media-api-keys
                key: qbittorrent

  - it: should open oauth2-proxy's port on qBittorrent's service
    template: charts/qbittorrent/templates/service.yaml
    asserts:
      - contains:
          path: spec.ports
          content:
            name: sso
            port: 4180
            protocol: TCP

  - it: should run qBittorrent without oauth2-proxy when single sign-on is off
    set:
      global.bbe.sso.enabled: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
        template: charts/qbittorrent/templates/deployment.yaml
      - notContains:
          path: spec.ports
          content:
            name: sso
            port: 4180
            protocol: TCP
        template: charts/qbittorrent/templates/service.yaml

  - it: should copy bbe-auth's oauth2-proxy secret for the one in qBittorrent's pod
    template: templates/secrets.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-oauth2-proxy
            namespace: bbe-auth
          data:
            client-id: b2F1dGgyLXByb3h5
            client-secret: Y2xpZW50LXNlY3JldA==
            cookie-secret: Y29va2llLXNlY3JldA==
    documentSelector:
      path: metadata.name
      value: bbe-media-sso
    asserts:
      - equal:
          path: data
          value:
            client-id: b2F1dGgyLXByb3h5
            client-secret: Y2xpZW50LXNlY3JldA==
            cookie-secret: Y29va2llLXNlY3JldA==

  - it: should generate an API key qBittorrent accepts
    template: templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: bbe-media-api-keys
    asserts:
      - matchRegex:
          path: data.qbittorrent
          pattern: ^qbt_[A-Za-z0-9]{28}$
          decodeBase64: true

  - it: should tell the setup about single sign-on and qBittorrent's API key
    template: templates/setup.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSO
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QBITTORRENT_API_KEY
            valueFrom:
              secretKeyRef:
                name: bbe-media-api-keys
                key: qbittorrent
