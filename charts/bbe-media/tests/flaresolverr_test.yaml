suite: test FlareSolverr
values:
  - ./values/required-values.yaml
release:
  name: bbe-media
  namespace: bbe-media
tests:
  - it: should run FlareSolverr as its own non-root user
    template: templates/flaresolverr.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/flaresolverr/flaresolverr:v3.5.2
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.volumes
          content:
            name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 256Mi

  - it: should serve FlareSolverr inside the cluster only
    template: templates/flaresolverr.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: bbe-media-flaresolverr
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8191

  - it: should give the setup FlareSolverr's address and timeout
    template: templates/setup.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      bbe.media.flaresolverr.requestTimeout: 90
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FLARESOLVERR_URL
            value: http://bbe-media-flaresolverr:8191
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FLARESOLVERR_TIMEOUT
            value: "90"

  - it: should leave FlareSolverr out when disabled
    templates:
      - templates/flaresolverr.yaml
      - templates/setup.yaml
    set:
      bbe.media.flaresolverr.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/flaresolverr.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: FLARESOLVERR_URL
            value: http://bbe-media-flaresolverr:8191
        template: templates/setup.yaml
        documentSelector:
          path: kind
          value: Job

  - it: should refuse a timeout FlareSolverr doesn't take
    template: templates/flaresolverr.yaml
    set:
      bbe.media.flaresolverr.requestTimeout: 600
    asserts:
      - failedTemplate:
          errorPattern: requestTimeout
