global:
  bbe:
    # -- The domain the apps are named under, such as sonarr.bbe.home.arpa, the same as bbe-networking's
    domain: bbe.home.arpa
    sso:
      # -- Whether the apps managing the media sign people in with Keycloak, through bbe-auth's oauth2-proxy. They then
      # skip their own logins, which only bbe's setup and the apps' connections to each other use. Jellyfin and Seerr
      # keep their own logins either way
      enabled: true

bbe:
  media:
    ingress:
      # -- Whether to serve every app at <app>.<domain>, through bbe-networking's Traefik
      enabled: true
    nfs:
      # -- The NFS server holding the media library, as a hostname or IP address
      server: ""
      # -- The exported path of the media library on the NFS server
      path: ""
      # -- Mount options for the NFS share. NFSv4 needs no lock daemon, which Talos nodes don't run, and `nfsvers=4`
      # uses the newest NFSv4 version the server offers, such as 4.0 on Synology NAS where 4.1 isn't offered
      mountOptions:
        - nfsvers=4
    # -- The size of the media library. NFS doesn't enforce it, but Kubernetes needs one
    size: 1Ti
    # The NAS user the apps write the library as, so nothing is written there as root and the share can map root
    # away. Its IDs are shown by `id <user>` on the NAS
    user:
      # -- The user ID of the NAS user owning the media library share
      uid:
      # -- The group ID of the NAS user owning the media library share
      gid:
    prowlarr:
      # -- The indexers Prowlarr searches, and shares with Sonarr and Radarr. Add them with `bbe configure bbe-media`.
      # Each has the `name` it gets in Prowlarr, the Prowlarr `definition` it's made from, its `fields`, and in
      # `secretFields` the key in the `bbe-media-indexers` secret of each field that's a credential
      indexers: []
    flaresolverr:
      # -- Whether to run FlareSolverr, which Prowlarr sends an indexer's requests through when Cloudflare challenges
      # them. The setup tags every indexer it adds for it
      enabled: true
      image:
        # -- The FlareSolverr image
        repository: ghcr.io/flaresolverr/flaresolverr
        # -- The FlareSolverr image tag
        tag: v3.5.2
      # -- How long FlareSolverr may take to get past a challenge, in seconds, from 1 to 180
      requestTimeout: 60
      resources:
        requests:
          # -- The memory to request for FlareSolverr, which runs Chromium
          memory: 256Mi
          # -- The CPU to request for FlareSolverr
          cpu: 50m
        limits:
          # -- The memory to limit FlareSolverr to
          memory: 1Gi
  admin:
    # -- The username for every app's web UI. Its password is generated into the `bbe-media-admin` secret
    username: admin
  setup:
    # -- Whether to connect the apps to each other after every install and upgrade
    enabled: true
    image:
      # -- The image to run the setup with, which only needs Python
      repository: python
      # -- The tag of the setup image
      tag: "3.13-alpine"
    # -- How long the setup waits for the apps to start, in seconds
    readyTimeout: 900
    # -- How many times the setup is retried when an app couldn't be set up
    backoffLimit: 5
    resources:
      requests:
        # -- The amount of memory to request for the setup pod
        memory: "64Mi"
        # -- The amount of CPU to request for the setup pod
        cpu: "50m"
      limits:
        # -- The amount of memory to limit the setup pod to
        memory: "128Mi"

# Each app starts with the API key the setup connects it with, from the `bbe-media-api-keys` secret,
# and stores its media on the shared library. The apps on the library are linuxserver or hotio images, which
# write as the user in PUID and PGID, from the `bbe-media-user` config map.
#
# The library lives on the NAS. The node only holds what's faster there, 31Gi together on the default
# StorageClass: the five apps' configs (1Gi each), Jellyfin's config (3Gi) and transcoding cache (2Gi),
# Seerr's config (1Gi), and qBittorrent's downloads in progress (20Gi), which it moves to the library
# once complete
sonarr:
  sonarr:
    env:
      - name: SONARR__AUTH__APIKEY
        valueFrom:
          secretKeyRef:
            name: bbe-media-api-keys
            key: sonarr
      - name: PUID
        valueFrom:
          configMapKeyRef:
            name: bbe-media-user
            key: PUID
      - name: PGID
        valueFrom:
          configMapKeyRef:
            name: bbe-media-user
            key: PGID
  media:
    existingClaim: bbe-media-library

radarr:
  radarr:
    env:
      - name: RADARR__AUTH__APIKEY
        valueFrom:
          secretKeyRef:
            name: bbe-media-api-keys
            key: radarr
      - name: PUID
        valueFrom:
          configMapKeyRef:
            name: bbe-media-user
            key: PUID
      - name: PGID
        valueFrom:
          configMapKeyRef:
            name: bbe-media-user
            key: PGID
  media:
    existingClaim: bbe-media-library

prowlarr:
  prowlarr:
    env:
      - name: PROWLARR__AUTH__APIKEY
        valueFrom:
          secretKeyRef:
            name: bbe-media-api-keys
            key: prowlarr

bazarr:
  bazarr:
    env:
      # Bazarr loads its settings with Dynaconf, which reads overrides from DYNACONF_ variables
      - name: DYNACONF_AUTH__APIKEY
        valueFrom:
          secretKeyRef:
            name: bbe-media-api-keys
            key: bazarr
      - name: PUID
        valueFrom:
          configMapKeyRef:
            name: bbe-media-user
            key: PUID
      - name: PGID
        valueFrom:
          configMapKeyRef:
            name: bbe-media-user
            key: PGID
  media:
    existingClaim: bbe-media-library

qbittorrent:
  qbittorrent:
    webui:
      existingSecret: bbe-media-admin
      # Sonarr, Radarr and the setup sign in with the API key
      apiKeySecret: bbe-media-api-keys
      apiKeyKey: qbittorrent
      # Only the oauth2-proxy in qBittorrent's pod reaches it from 127.0.0.1, after checking the sign-in
      localHostAuth: false
    env:
      - name: PUID
        valueFrom:
          configMapKeyRef:
            name: bbe-media-user
            key: PUID
      - name: PGID
        valueFrom:
          configMapKeyRef:
            name: bbe-media-user
            key: PGID
  media:
    existingClaim: bbe-media-library
  incomplete:
    enabled: true
    # -- The node storage for downloads in progress. Downloads that don't fit together wait until others complete
    size: 20Gi
  # qBittorrent only skips its own login for requests from its pod, so browsers go through an oauth2-proxy in the pod.
  # It reads the sign-in from bbe-auth's oauth2-proxy, which Traefik asks first, with the same cookie
  extraContainers: |
    {{- if .Values.global.bbe.sso.enabled }}
    - name: sso
      image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
      args:
        - --http-address=0.0.0.0:4180
        - --upstream=http://127.0.0.1:8080
        - --provider=keycloak-oidc
        - --oidc-issuer-url=https://auth.{{ .Values.global.bbe.domain }}/realms/bbe
        - --skip-oidc-discovery=true
        - --login-url=https://auth.{{ .Values.global.bbe.domain }}/realms/bbe/protocol/openid-connect/auth
        - --redeem-url=http://bbe-auth-keycloak-http.bbe-auth.svc/realms/bbe/protocol/openid-connect/token
        - --oidc-jwks-url=http://bbe-auth-keycloak-http.bbe-auth.svc/realms/bbe/protocol/openid-connect/certs
        - --redirect-url=https://auth.{{ .Values.global.bbe.domain }}/oauth2/callback
        - --cookie-name=_bbe_sso
        - --cookie-domain=.{{ .Values.global.bbe.domain }}
        - --whitelist-domain=.{{ .Values.global.bbe.domain }}
        - --cookie-secure=true
        - --reverse-proxy=true
        - --skip-provider-button=true
        - --email-domain=*
        - --allowed-group=admins
        - --code-challenge-method=S256
        - --scope=openid email profile groups
      env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: bbe-media-sso
              key: client-id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: bbe-media-sso
              key: client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: bbe-media-sso
              key: cookie-secret
      ports:
        - name: sso
          containerPort: 4180
      readinessProbe:
        httpGet:
          path: /ping
          port: sso
      resources:
        requests:
          memory: 32Mi
          cpu: 10m
        limits:
          memory: 128Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
    {{- end }}
  service:
    extraPorts: |
      {{- if .Values.global.bbe.sso.enabled }}
      - name: sso
        port: 4180
        protocol: TCP
      {{- end }}

# The linuxserver image, like the other apps, so Jellyfin also reads the library as the NAS user
jellyfin:
  image:
    repository: lscr.io/linuxserver/jellyfin
    # Jellyfin 12, its current release, instead of the 10.11 the jellyfin chart defaults to
    tag: 12.2ubu2604-ls53
  jellyfin:
    env:
      - name: PUID
        valueFrom:
          configMapKeyRef:
            name: bbe-media-user
            key: PUID
      - name: PGID
        valueFrom:
          configMapKeyRef:
            name: bbe-media-user
            key: PGID
  persistence:
    config:
      size: 3Gi
    media:
      existingClaim: bbe-media-library
    # Transcoding is bounded instead of filling the node's disk. The linuxserver image keeps its cache in /config,
    # and gives /transcode to Jellyfin for transcoding, which the setup points Jellyfin at
    cache:
      enabled: true
      size: 2Gi
  volumeMounts:
    - name: cache
      mountPath: /transcode

# Seerr, which Jellyseerr became, at its latest release instead of the one its chart defaults to
seerr-chart:
  image:
    tag: v3.5.0
  config:
    persistence:
      size: 1Gi
