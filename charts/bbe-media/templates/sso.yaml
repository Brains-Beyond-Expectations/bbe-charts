{{- if .Values.global.bbe.sso.enabled }}
# Traefik asks bbe-auth's oauth2-proxy whether a request may go through. It answers 202 for an admin signed in with
# Keycloak, and sends whoever isn't signed in to Keycloak, back to where they were going after
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-media.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://bbe-auth-oauth2-proxy.bbe-auth.svc.cluster.local/
    # oauth2-proxy sends people back to where they were going from the X-Forwarded-* headers. It only redirects to
    # addresses under the domain
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
{{- end }}
