{{- /*
The secrets are generated on the first install and read back from the cluster on every upgrade,
as the apps keep using the keys and login they started with
*/ -}}
{{- $apiKeys := (lookup "v1" "Secret" .Release.Namespace "bbe-media-api-keys").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: bbe-media-api-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-media.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $app := list "bazarr" "prowlarr" "radarr" "sonarr" }}
  {{ $app }}: {{ get $apiKeys $app | default (uuidv4 | replace "-" "" | b64enc) }}
  {{- end }}
  # qBittorrent only accepts a key of `qbt_` and 28 more characters
  qbittorrent: {{ get $apiKeys "qbittorrent" | default (printf "qbt_%s" (randAlphaNum 28) | b64enc) }}
---
{{- $admin := (lookup "v1" "Secret" .Release.Namespace "bbe-media-admin").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: bbe-media-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-media.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.bbe.admin.username | b64enc }}
  password: {{ get $admin "password" | default (randAlphaNum 24 | b64enc) }}
{{- if .Values.global.bbe.sso.enabled }}
{{- /*
The password Jellyfin binds to bbe-auth's LDAP with, which bbe installs first. It's copied from bbe-auth's secret on
every install and upgrade
*/}}
{{- $auth := (lookup "v1" "Secret" "bbe-auth" "bbe-auth-authentik").data | default dict }}
{{- if $auth }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bbe-media-ldap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-media.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ get $auth "BBE_JELLYFIN_LDAP_PASSWORD" }}
{{- end }}
{{- end }}
