suite: test secrets
values:
  - ./values/required-values.yaml
templates:
  - secrets.yaml
release:
  name: bbe-ai
  namespace: bbe-ai
tests:
  - it: should generate Open WebUI's secret key
    documentSelector:
      path: metadata.name
      value: bbe-ai-open-webui
    asserts:
      - matchRegex:
          path: data.secret-key
          pattern: ^[A-Za-z0-9]{48}$
          decodeBase64: true

  - it: should keep Open WebUI's secret key, and copy its client secret from bbe-auth
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-ai-open-webui
            namespace: bbe-ai
          data:
            secret-key: a2VwdC1rZXk=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-authentik
            namespace: bbe-auth
          data:
            BBE_OPEN_WEBUI_CLIENT_SECRET: Y2xpZW50LXNlY3JldA==
    asserts:
      - equal:
          path: data.secret-key
          value: kept-key
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-ai-open-webui
      - equal:
          path: data.open-webui-client-secret
          value: client-secret
          decodeBase64: true
        documentSelector:
          path: metadata.name
          value: bbe-ai-auth

  - it: should refuse to install before bbe-auth has Open WebUI's client
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: bbe-auth-authentik
            namespace: bbe-auth
          data:
            BBE_SHELFMARK_CLIENT_SECRET: c2hlbGZtYXJr
    asserts:
      - failedTemplate:
          errorPattern: Run `bbe upgrade` to upgrade bbe-auth first

  - it: should have no secrets without Open WebUI
    set:
      bbe.ai.chat.enabled: false
    asserts:
      - hasDocuments:
          count: 0
