{{- if include "bbe-ai.chatEnabled" . }}
{{- /*
The secrets are generated on the first install and read back from the cluster on every upgrade, as Open WebUI keeps
signing people in with the key it started with
*/ -}}
{{- $openWebui := (lookup "v1" "Secret" .Release.Namespace (printf "%s-open-webui" .Release.Name)).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-open-webui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-ai.labels" . | nindent 4 }}
type: Opaque
data:
  # What Open WebUI signs its sessions with
  secret-key: {{ get $openWebui "secret-key" | default (randAlphaNum 48 | b64enc) }}
{{- $auth := (lookup "v1" "Secret" "bbe-auth" "bbe-auth-authentik").data | default dict }}
{{- if $auth }}
{{- if not (get $auth "BBE_OPEN_WEBUI_CLIENT_SECRET") }}
{{- fail "bbe-auth has no OpenID Connect client for Open WebUI yet. Run `bbe upgrade` to upgrade bbe-auth first, or set bbe.ai.chat.enabled to false" }}
{{- end }}
---
# Open WebUI's OIDC client secret, which bbe-auth generates for authentik
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-ai.labels" . | nindent 4 }}
type: Opaque
data:
  open-webui-client-secret: {{ get $auth "BBE_OPEN_WEBUI_CLIENT_SECRET" }}
{{- end }}
{{- $ca := (lookup "v1" "Secret" "bbe-networking" "bbe-ca").data | default dict }}
{{- if $ca }}
---
# bbe's certificate authority, which Open WebUI trusts authentik's certificate with
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbe-ai.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- get $ca "ca.crt" | b64dec | nindent 4 }}
{{- end }}
{{- end }}
